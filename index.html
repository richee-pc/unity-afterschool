<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="유니티로 배우는 게임 프로그래밍 · 13차시 미션보드 by pcteachpc">
<meta property="og:type" content="website">
<meta property="og:title" content="유니티 방과후 미션보드">
<meta property="og:description" content="13번의 미션으로 내 게임 하나 만들기 — 차시별 미션과 코드">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127918;</text></svg>">

<style>
/* 브라우저 기본 여백 초기화 (Artifact 환경과 동일하게 맞춤) */
html,body{margin:0;padding:0}
</style>
<title>방과후 미션보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">

<style>
/* ── 토큰 : 밝은 테마(기본) ───────────────────────────── */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#E8EDF1;
  --ink:#15181C; --ink-2:#495159; --ink-3:#79838D;
  --line:#DBE1E7; --line-2:#C6CFD8;
  --x:#D9433F; --y:#4E9410; --z:#2360CE;
  --y-soft:#EAF5DC; --x-soft:#FBE7E6; --z-soft:#E3ECFC; --gold:#F2B705; --gold-soft:#FFF6DC;
  --shadow:0 1px 2px rgba(20,30,40,.06), 0 8px 24px -12px rgba(20,30,40,.18);
  --slab:#1D2226; --slab-2:#272D33; --slab-line:#343C43; --slab-ink:#DDE3E8;
  --slab-kw:#7FB3FF; --slab-ty:#9BDE4F; --slab-st:#FF8A84; --slab-cm:#6E7A85; --slab-fn:#E9C46A;
  --r:14px;
}
/* ── 토큰 : 어두운 테마 (유니티 에디터 그레이) ─────────── */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F2225; --surface:#2A2E32; --surface-2:#32373C; --surface-3:#3A4046;
    --ink:#ECEFF2; --ink-2:#AFB7BF; --ink-3:#828B95;
    --line:#3C4248; --line-2:#4A5158;
    --x:#FF6F6A; --y:#8CDA3F; --z:#6BA5F7;
    --y-soft:#2C3A22; --x-soft:#3B2725; --z-soft:#22303F; --gold:#F5C542; --gold-soft:#3A3113;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1F2225; --surface:#2A2E32; --surface-2:#32373C; --surface-3:#3A4046;
  --ink:#ECEFF2; --ink-2:#AFB7BF; --ink-3:#828B95;
  --line:#3C4248; --line-2:#4A5158;
  --x:#FF6F6A; --y:#8CDA3F; --z:#6BA5F7;
  --y-soft:#2C3A22; --x-soft:#3B2725; --z-soft:#22303F; --gold:#F5C542; --gold-soft:#3A3113;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.72; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{text-wrap:balance; margin:0}
a{color:var(--z)}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--z); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ── 헤더 ─────────────────────────────────────────────── */
.top{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line)}
.top-in{max-width:1240px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:11px; margin-right:auto}
.play{width:30px; height:30px; border-radius:8px; background:var(--y); display:grid; place-items:center; flex:none}
.play::after{content:""; width:0; height:0; margin-left:2px;
  border-left:9px solid #10160B; border-top:6px solid transparent; border-bottom:6px solid transparent}
.brand b{font-size:1.12rem; letter-spacing:-.01em; display:block}
.brand span{display:block; font-size:.71rem; color:var(--ink-3); letter-spacing:.09em; line-height:1.3}

.tabs{display:flex; gap:5px; background:var(--surface-2); padding:4px; border-radius:11px}
.tab{border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  padding:7px 15px; border-radius:8px; font-size:.9rem; font-weight:600}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

.gauge{display:flex; align-items:center; gap:10px}
.gauge svg{display:block; transform:rotate(-90deg)}
.gauge-t{font-size:.74rem; color:var(--ink-3); line-height:1.35}
.gauge-t b{display:block; font-size:.95rem; color:var(--ink); font-variant-numeric:tabular-nums}

/* ── 레이아웃 ─────────────────────────────────────────── */
.wrap{max-width:1240px; margin:0 auto; padding:26px 22px 90px;
  display:grid; grid-template-columns:250px minmax(0,1fr); gap:30px; align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:1fr; gap:18px; padding:16px 14px 70px} }

/* ── 좌측 스테이지 트랙 ───────────────────────────────── */
.rail{position:sticky; top:78px}
.rail-h{font-size:.69rem; letter-spacing:.16em; color:var(--ink-3); font-weight:600; margin:0 0 10px 4px}
.track{display:flex; flex-direction:column; gap:3px; position:relative}
.track::before{content:""; position:absolute; left:20px; top:18px; bottom:18px; width:2px; background:var(--line); border-radius:2px}
.node{position:relative; display:grid; grid-template-columns:40px 1fr; gap:11px; align-items:center;
  border:0; background:transparent; text-align:left; cursor:pointer;
  padding:6px 9px; border-radius:11px; color:var(--ink-2); width:100%; transition:background .14s}
.node:hover{background:var(--surface-2)}
.node .dot{position:relative; z-index:1; width:40px; height:40px; border-radius:11px;
  background:var(--surface); border:2px solid var(--line-2); color:var(--ink-3);
  display:grid; place-items:center; font-size:1rem; flex:none;
  font-family:"Black Han Sans",sans-serif; font-variant-numeric:tabular-nums}
.node .lb{min-width:0}
.node .lb b{display:block; font-size:.87rem; font-weight:600; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4}
.node .lb i{font-style:normal; font-size:.7rem; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}
.node.on{background:var(--surface); box-shadow:var(--shadow)}
.node.on .dot{background:var(--y); border-color:var(--y); color:#10160B}
.node.done .dot{background:var(--y-soft); border-color:var(--y); color:var(--y)}
.node.on.done .dot{background:var(--y); color:#10160B}

@media (max-width:900px){
  .rail{position:static}
  .rail-h{display:none}
  .track{flex-direction:row; overflow-x:auto; gap:7px; padding:4px 2px 10px}
  .track::before{display:none}
  .node{grid-template-columns:1fr; width:auto; flex:none; padding:5px; justify-items:center}
  .node .lb{display:none}
}

/* ── 본문 카드 ────────────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden}
.pane{animation:in .28s ease both}
@keyframes in{from{opacity:0; transform:translateY(6px)}to{opacity:1;transform:none}}

.head{padding:26px 30px 24px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface-2),var(--surface))}
@media (max-width:640px){ .head{padding:20px 18px} }
.eyebrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px}
.pill{font-size:.71rem; font-weight:600; letter-spacing:.03em; padding:3px 10px; border-radius:99px;
  border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface)}
.pill.date{font-family:"IBM Plex Mono",monospace; letter-spacing:0}
.pill.lv1{background:var(--y-soft); border-color:transparent; color:var(--y)}
.pill.lv2{background:var(--z-soft); border-color:transparent; color:var(--z)}
.pill.lv3{background:var(--x-soft); border-color:transparent; color:var(--x)}
.pill.stg{font-family:"Black Han Sans",sans-serif; letter-spacing:.1em;
  background:var(--ink); color:var(--bg); border-color:transparent}
.head h1{font-family:"Black Han Sans",sans-serif; font-size:clamp(1.55rem,4.4vw,2.3rem);
  line-height:1.3; letter-spacing:-.005em; font-weight:400}
.head p{margin:11px 0 0; color:var(--ink-2); font-size:1.01rem; max-width:62ch}

.body{padding:8px 30px 30px}
@media (max-width:640px){ .body{padding:6px 18px 22px} }
.sec{padding-top:26px}
.sec-h{display:flex; align-items:baseline; gap:10px; margin-bottom:13px; flex-wrap:wrap}
.sec-h h2{font-size:1rem; font-weight:700; letter-spacing:-.01em}
.sec-h em{font-style:normal; font-size:.77rem; color:var(--ink-3)}

/* 타임테이블 */
.clock{display:flex; border:1px solid var(--line); border-radius:11px; overflow:hidden}
.clock div{flex:1; padding:11px 14px; border-right:1px solid var(--line); background:var(--surface-2); min-width:0}
.clock div:last-child{border-right:0}
.clock b{display:block; font-family:"IBM Plex Mono",monospace; font-size:1rem; color:var(--ink)}
.clock span{font-size:.77rem; color:var(--ink-3)}
@media (max-width:560px){ .clock{flex-wrap:wrap} .clock div{flex:1 1 45%; border-bottom:1px solid var(--line)} }

/* 미션 체크리스트 */
.quests{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.quests li{display:flex}
.q{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
  padding:12px 15px; color:var(--ink); font-size:.96rem; line-height:1.62; transition:.14s}
.q:hover{border-color:var(--line-2)}
.q .bx{width:21px; height:21px; border-radius:6px; border:2px solid var(--line-2);
  flex:none; margin-top:3px; display:grid; place-items:center; font-size:.78rem; color:transparent;
  font-weight:700; transition:.14s}
.q[aria-pressed="true"]{background:var(--y-soft); border-color:var(--y)}
.q[aria-pressed="true"] .bx{background:var(--y); border-color:var(--y); color:#10160B; transform:scale(1.07)}
.q[aria-pressed="true"] .qt{color:var(--ink-2)}
.q .qn{font-family:"IBM Plex Mono",monospace; font-size:.77rem; color:var(--ink-3); flex:none; margin-top:3px}

/* 코드 슬랩 : 밝은/어두운 테마 모두에서 에디터 화면처럼 */
.slab{background:var(--slab); border-radius:12px; overflow:hidden; border:1px solid var(--slab-line)}
.slab + .slab{margin-top:12px}
.slab-top{display:flex; align-items:center; gap:9px; padding:8px 10px 8px 14px;
  background:var(--slab-2); border-bottom:1px solid var(--slab-line)}
.cs{height:17px; padding:0 5px; border-radius:4px; background:#2F5FA8; color:#DCE8FA;
  font-size:.6rem; font-weight:700; display:grid; place-items:center; flex:none;
  font-family:"IBM Plex Mono",monospace}
.slab-top b{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--slab-ink); font-weight:400}
.copy{margin-left:auto; border:1px solid var(--slab-line); background:transparent; color:#A9B4BE;
  font-size:.76rem; padding:4px 11px; border-radius:7px; cursor:pointer; font-weight:500}
.copy:hover{background:#343C43; color:#fff}
.copy.ok{background:var(--slab-ty); border-color:var(--slab-ty); color:#10160B}
.slab pre{margin:0; padding:15px 17px; overflow-x:auto; font-family:"IBM Plex Mono",monospace;
  font-size:.84rem; line-height:1.78; color:var(--slab-ink); tab-size:4}
.slab .kw{color:var(--slab-kw)} .slab .ty{color:var(--slab-ty)}
.slab .st{color:var(--slab-st)} .slab .cm{color:var(--slab-cm)} .slab .fn{color:var(--slab-fn)}

/* 표 */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:11px}
table{border-collapse:collapse; width:100%; font-size:.89rem; min-width:380px}
th,td{padding:9px 14px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{background:var(--surface-2); font-weight:600; font-size:.77rem; letter-spacing:.05em; color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; color:var(--ink-2)}
code{font-family:"IBM Plex Mono",monospace; font-size:.86em;
  background:var(--surface-3); padding:1.5px 6px; border-radius:5px}
.slab code{background:transparent; padding:0}

/* 노트 박스 */
.note{border-radius:11px; padding:14px 17px; font-size:.92rem; line-height:1.68;
  border:1px solid var(--line); background:var(--surface-2)}
.note + .note{margin-top:9px}
.note.warn{background:var(--x-soft); border-color:transparent}
.note.tip{background:var(--z-soft); border-color:transparent}
.note > b{display:block; margin-bottom:5px}
.note ul,.note ol{margin:6px 0 0; padding-left:19px} .note li{margin:5px 0}
.note li b{display:inline}

/* 링크 목록 */
.links{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:9px}
.lk{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;
  border:1px solid var(--line); border-radius:11px; padding:12px 15px; background:var(--surface-2);
  width:100%; text-align:left; font:inherit; cursor:pointer}
.lk:hover{border-color:var(--z); background:var(--surface)}
.lk .lt{min-width:0}
.lk b{display:block; font-size:.93rem; line-height:1.45}
.lk i{font-style:normal; display:block; font-family:"IBM Plex Mono",monospace;
  font-size:.76rem; color:var(--z); word-break:break-all}
.lk em{font-style:normal; display:block; font-size:.78rem; color:var(--ink-3); line-height:1.55; margin-top:2px}
.lk .ar{margin-left:auto; color:var(--ink-3); font-size:1.05rem; flex:none}
.step p a, .lc p a{color:var(--z); text-decoration:underline; text-underline-offset:2px}

/* 개념 카드 */
.learn{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:10px}
.lc{border:1px solid var(--line); border-radius:11px; padding:14px 16px; background:var(--surface-2)}
.lc .k{display:block; font-family:"IBM Plex Mono",monospace; font-size:.68rem;
  color:var(--y); letter-spacing:.1em; margin-bottom:4px}
.lc > b{display:block; font-size:.93rem; margin-bottom:5px; line-height:1.5}
.lc p{margin:0; font-size:.875rem; color:var(--ink-2); line-height:1.72}
.lc p b{display:inline; color:var(--ink)}
.lc code{background:var(--surface-3)}

/* 설치 단계 */
.card2{border:1px solid var(--line); border-radius:12px; padding:4px 18px; background:var(--surface-2)}
.steps{display:flex; flex-direction:column}
.step{display:grid; grid-template-columns:34px 1fr; gap:14px; padding:15px 0;
  border-bottom:1px solid var(--line); align-items:start}
.step:last-child{border-bottom:0}
.step .sn{width:34px; height:34px; border-radius:10px; background:var(--z-soft); color:var(--z);
  display:grid; place-items:center; font-family:"Black Han Sans",sans-serif; font-size:1rem}
.step > span > b{display:block; font-size:.98rem; margin-bottom:4px; line-height:1.5}
.step p{margin:0; font-size:.9rem; color:var(--ink-2); line-height:1.78}
.step p b{display:inline; color:var(--ink)}
.step code{background:var(--surface-3)}
@media (max-width:520px){ .card2{padding:4px 14px} .step{grid-template-columns:28px 1fr; gap:11px}
  .step .sn{width:28px;height:28px;font-size:.85rem} }

/* 🧭 맨 위에 붙어 다니는 흐름 바 */
.flowbar{position:sticky; top:0; z-index:6; margin:0 0 11px; padding:9px 13px;
  background:var(--surface); border:1px solid var(--line); border-radius:13px;
  box-shadow:0 6px 18px -12px rgba(20,30,40,.4);
  display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:thin}
.flowbar::-webkit-scrollbar{height:5px}
.flowbar::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:9px}
.flowbar .jl{flex:none}
.jchip{flex:none}
@media (max-width:900px){ .flowbar{padding:8px 11px; border-radius:11px} }

/* 섹션 색 띠 — 종류가 한눈에 */
.sec > .sec-h{position:relative; padding-left:12px}
.sec > .sec-h::before{content:""; position:absolute; left:0; top:2px; bottom:2px;
  width:4px; border-radius:99px; background:var(--line-2)}
.sec.t-learn > .sec-h::before{background:var(--z)}
.sec.t-quest > .sec-h::before{background:var(--y)}
.sec.t-code  > .sec-h::before{background:var(--ink-3)}
.sec.t-table > .sec-h::before{background:#9A6BD6}
.sec.t-help  > .sec-h::before{background:var(--x)}
.sec.t-gen   > .sec-h::before{background:var(--z)}

/* 도움말 2단 */
.notes{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:10px; align-items:start}

/* 좁은 표는 나란히 */
.tgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(390px,1fr));
  gap:4px 22px; align-items:start}
.tgrid > .sec{padding-top:18px}

/* 도전 항목 2단 (넓은 화면에서만)
   — 뒤에 나오는 .chal-body{display:flex} 를 이기려고 선택자를 한 단계 더 씁니다 */
@media (min-width:860px){
  .chal > .chal-body{display:grid; grid-template-columns:1fr 1fr; gap:9px; align-items:start}
}

.node.gal{text-decoration:none; margin-top:10px; border-top:1px dashed var(--line-2);
  padding-top:13px; border-radius:0 0 12px 12px}
.node.gal .dot{background:var(--y-soft); color:var(--y); border-color:var(--y)}
.node.gal:hover .lb b{color:var(--y)}

/* 🎯 미션별 바로가기 */
.quests li{display:flex}
.qgo + .qgo{margin-left:5px}
.qgo{display:inline-flex; align-items:center; gap:4px; margin:0 0 0 7px; vertical-align:baseline;
  border:1px solid var(--z); background:var(--z-soft); color:var(--z);
  border-radius:99px; padding:3px 11px; font-size:.76rem; font-weight:600;
  cursor:pointer; font-family:inherit; white-space:nowrap}
.qgo:hover{background:var(--z); color:#fff}

/* 💻 코드는 접혀 있다가 누르면 전체 + 복사 */
.slab.clip{cursor:pointer}
.slab.clip pre{max-height:168px; overflow:hidden}
.slab.clip .copy{display:none}
.slab .more{display:none}
.slab.clip .more{display:flex; align-items:center; justify-content:center; gap:7px;
  padding:10px; background:linear-gradient(to top, var(--slab) 55%, transparent);
  color:#A9B4BE; font-size:.8rem; font-weight:600; margin-top:-48px; position:relative;
  font-family:"IBM Plex Sans KR",sans-serif}
.slab.clip:hover .more{color:#fff}
.slab.clip:hover{border-color:var(--z)}
.q:focus-visible{outline:2.5px solid var(--z); outline-offset:3px}

/* ▶ 직접 해보기 */
.try{margin-bottom:11px; border:1.5px solid var(--line-2); border-radius:12px;
  background:var(--surface-2); overflow:hidden}
.try-top{display:flex; align-items:center; gap:9px; padding:10px 13px}
.try-top b{font-size:.86rem; color:var(--ink)}
.try-top em{font-style:normal; font-size:.76rem; color:var(--ink-3)}
.trybtn{margin-left:auto; border:0; border-radius:9px; background:var(--y); color:#10160B;
  font-size:.8rem; font-weight:700; padding:7px 15px; cursor:pointer; font-family:inherit;
  white-space:nowrap}
.trybtn:hover{filter:brightness(1.06)}
.try-box{display:none; border-top:1.5px solid var(--line-2); background:#fff}
.try.on .try-box{display:block}
.try-box iframe{display:block; width:100%; height:520px; border:0}
@media (max-width:640px){ .try-box iframe{height:430px} }

/* 🧭 섹션 바로가기 */
.jump{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 15px;
  padding:11px 13px; background:var(--surface-2); border:1px dashed var(--line-2);

const STAGES = [
{
 n:1, date:"7차시 · 10/19", lv:1, lvName:"첫 JS",
 title:"버튼이 살아난다",
 sub:"오늘 완성품은 두 개입니다. 클릭 게임을 만들고, 거기에 내 코드를 직접 보태 봅니다.",
 learn:[
  ["HTML · CSS · JS 셋의 역할","<b>HTML은 뼈대</b>(무엇이 있는가), <b>CSS는 옷</b>(어떻게 생겼는가), <b>JS는 움직임</b>(누르면 무슨 일이 생기는가). 여러분은 이미 뼈대와 옷을 만들 줄 압니다. <b>오늘 마지막 하나를 배웁니다.</b>"],
  ["한 파일 안에 셋이 다 들어 있어요","<code>click.html</code> 을 열면 위에서부터 <b>①&lt;style&gt; 안이 CSS</b> → <b>②&lt;body&gt; 안이 HTML</b> → <b>③&lt;script&gt; 안이 JS</b> 순서로 들어 있습니다. <b>고치고 싶은 게 뭐냐에 따라 가는 구역이 달라요.</b> 아래 '지도'를 꼭 보세요."],

 code:[
  ["click.html  ─ [1단계] 먼저 이것부터", `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>클릭 연타 게임</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #eef2f7; padding: 40px; }
  h1 { font-size: 34px; }
  #score { font-size: 90px; font-weight: bold; color: #2563eb; margin: 10px; }
  #msg { font-size: 28px; color: #16a34a; height: 40px; }
  button { font-size: 26px; padding: 18px 46px; border: 0; border-radius: 16px;
           background: #2563eb; color: white; cursor: pointer; }
  button:active { transform: scale(0.94); }
  #reset { background: #94a3b8; font-size: 16px; padding: 10px 24px; margin-top: 20px; }
</style>
</head>
<body>

  <h1>🖱️ 클릭 연타 게임</h1>
  <p>목표 : <b>20번</b> 누르기!</p>

  <div id="score">0</div>
  <div id="msg"></div>

  <button id="btn">눌러!</button>
  <br>
  <button id="reset">다시하기</button>

<script>
  // 1. 점수를 담을 상자(변수)
  let score = 0;

  // 2. 화면에 있는 것들을 잡아 온다
  const btn       = document.getElementById("btn");
  const scoreText = document.getElementById("score");
  const msg       = document.getElementById("msg");
  const resetBtn  = document.getElementById("reset");

  // 3. 버튼을 누르면 이 안이 실행된다
  btn.onclick = function () {
    score = score + 1;           // 점수 1 올리기
    scoreText.innerText = score; // 화면에 보여주기

    if (score >= 20) {           // 20점이 넘으면
      msg.innerText = "🎉 클리어!";
    }
  };

  // 4. 다시하기
  resetBtn.onclick = function () {
    score = 0;
    scoreText.innerText = 0;
    msg.innerText = "";
  };
<\/script>

</body>
</html>`],

 code:[["mole.html", `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>두더지 잡기</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #eef2f7; padding: 30px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  #info { font-size: 22px; margin-bottom: 16px; }
  #score, #time { font-weight: bold; color: #2563eb; }
  .grid { display: grid; grid-template-columns: repeat(3, 110px);
          gap: 12px; justify-content: center; }
  .hole { width: 110px; height: 110px; background: #cbd5e1; border-radius: 20px;
          font-size: 60px; line-height: 110px; cursor: pointer; user-select: none; }
  .hole:active { background: #94a3b8; }
  button { font-size: 20px; padding: 14px 36px; border: 0; border-radius: 14px;
           background: #2563eb; color: white; cursor: pointer; margin-top: 20px; }
</style>
</head>
<body>

  <h1>🐹 두더지 잡기</h1>
  <div id="info">점수 <span id="score">0</span> · 남은 시간 <span id="time">20</span>초</div>

  <div class="grid">
    <div class="hole" id="h0"></div>
    <div class="hole" id="h1"></div>
    <div class="hole" id="h2"></div>
    <div class="hole" id="h3"></div>
    <div class="hole" id="h4"></div>
    <div class="hole" id="h5"></div>
    <div class="hole" id="h6"></div>
    <div class="hole" id="h7"></div>
    <div class="hole" id="h8"></div>
  </div>

  <button id="start">시작!</button>

<script>
  let score = 0;
  let time  = 20;
  let now   = -1;      // 지금 두더지가 있는 구멍 번호
  let moleTimer, clockTimer;

  const scoreText = document.getElementById("score");
  const timeText  = document.getElementById("time");

  // 두더지를 아무 구멍에나 띄우기
  function showMole() {
    if (now >= 0) {
      document.getElementById("h" + now).innerText = "";
    }
    now = Math.floor(Math.random() * 9);   // 0~8 중 하나
    document.getElementById("h" + now).innerText = "🐹";
  }

  // 1초마다 시간 줄이기
  function countDown() {
    time = time - 1;
    timeText.innerText = time;
    if (time <= 0) {
      clearInterval(moleTimer);
      clearInterval(clockTimer);
      if (now >= 0) document.getElementById("h" + now).innerText = "";
      alert("끝! 점수는 " + score + "점");
    }
  }

  // 구멍 9개에 전부 클릭 기능 달기
  for (let i = 0; i < 9; i = i + 1) {
    document.getElementById("h" + i).onclick = function () {
      if (i === now) {             // 두더지가 있는 구멍을 눌렀으면
        score = score + 1;
        scoreText.innerText = score;
        document.getElementById("h" + i).innerText = "";
        now = -1;
      }
    };
  }

  // 시작 버튼
  document.getElementById("start").onclick = function () {
    score = 0; time = 20;
    scoreText.innerText = 0;
    timeText.innerText = 20;
    clearInterval(moleTimer);
    clearInterval(clockTimer);
    moleTimer  = setInterval(showMole, 800);   // 0.8초마다 두더지 이동
    clockTimer = setInterval(countDown, 1000); // 1초마다 시간 감소
  };
<\/script>

</body>
</html>`],
  ["📝 mole2.html  ─ 🔥 도전 빈칸 코드 (이걸 복사하세요!)", `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>두더지 잡기 — 도전 빈칸</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #eef2f7; padding: 30px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  #info { font-size: 22px; margin-bottom: 16px; }

  .grid { display: grid; grid-template-columns: repeat(3, 110px);
          gap: 12px; justify-content: center; }

          font-size: 60px; line-height: 110px; cursor: pointer; user-select: none; }
  .hole:active { background: #94a3b8; }
  #msg { font-size: 26px; color: #16a34a; height: 40px; margin-top: 14px; }
  button { font-size: 20px; padding: 14px 36px; border: 0; border-radius: 14px;
           background: #2563eb; color: white; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>

  <h1>🐹 두더지 잡기</h1>
  <div id="info">
    점수 <span id="score">0</span> ·
    남은 시간 <span id="time">20</span>초 ·
    최고 <span id="best">0</span>점
  </div>

  <div class="grid">
    <div class="hole" id="h0"></div>
    <div class="hole" id="h1"></div>
    <div class="hole" id="h2"></div>
    <div class="hole" id="h3"></div>
    <div class="hole" id="h4"></div>
    <div class="hole" id="h5"></div>
    <div class="hole" id="h6"></div>
    <div class="hole" id="h7"></div>
    <div class="hole" id="h8"></div>
  </div>

  <div id="msg"></div>
  <button id="start">시작!</button>

<script>
  let score = 0;
  let time  = 20;
  let now   = -1;
  let isBomb = false;
  let best  = 0;
  let moleTimer, clockTimer;

  const scoreText = document.getElementById("score");
  const timeText  = document.getElementById("time");
  const bestText  = document.getElementById("best");
  const msg       = document.getElementById("msg");

  function showMole() {
    if (now >= 0) {
      document.getElementById("h" + now).innerText = "";
    }
    now = Math.floor(Math.random() * 9);

    // ━━━━━━━━━━ 빈칸 ① ━━━━━━━━━━
    // 아래 0 을 0.25 로 바꾸면 4번에 1번꼴로 폭탄이 나옵니다
    isBomb = Math.random() < 0;

    // ━━━━━━━━━━ 빈칸 ② ━━━━━━━━━━
    // 아래 앞쪽 "🐹" 를 "💣" 로 바꾸세요 (폭탄일 때 보일 그림)
    document.getElementById("h" + now).innerText = isBomb ? "🐹" : "🐹";
  }

  function countDown() {
    time = time - 1;
    timeText.innerText = time;

    // ━━━━━━━━━━ 빈칸 ③ ━━━━━━━━━━
    // 아래 0 을 5 로 바꾸면 5초 남았을 때부터 빨개집니다
    if (time <= 0) {
      timeText.style.color = "red";
    }

    if (time <= 0) {
      clearInterval(moleTimer);
      clearInterval(clockTimer);
      if (now >= 0) document.getElementById("h" + now).innerText = "";

      // ━━━━━━━━━━ 빈칸 ④ ━━━━━━━━━━
      // 아래 9999 를 best 로 바꾸면 최고 점수가 기록됩니다
      if (score > 9999) {
        best = score;
        bestText.innerText = best;
      }

      // ━━━━━━━━━━ 빈칸 ⑤ ━━━━━━━━━━
      // 아래 "" 안에 보여줄 말을 쓰세요.  예) "끝! " + score + "점 🎉"
      msg.innerText = "";

      // ━━━━━━━━━━ 빈칸 ⑥ ━━━━━━━━━━
      // 아래 alert 줄을 통째로 지우세요 (이제 화면에 보여주니까요)
      alert("끝! 점수는 " + score + "점");
    }
  }

  for (let i = 0; i < 9; i = i + 1) {
    document.getElementById("h" + i).onclick = function () {
      if (i === now) {

        if (isBomb) {
          // ━━━━━━━━━━ 빈칸 ⑦ ━━━━━━━━━━
          // 아래 0 을 2 로 바꾸면 폭탄을 누를 때 2점이 깎입니다
          score = score - 0;
        } else {
          score = score + 1;
        }

        scoreText.innerText = score;
        document.getElementById("h" + i).innerText = "";
        now = -1;
      }
    };
  }

  document.getElementById("start").onclick = function () {
    clearInterval(moleTimer);
    clearInterval(clockTimer);
    score = 0; time = 20; now = -1;
    scoreText.innerText = 0;
    timeText.innerText = 20;
    timeText.style.color = "#2563eb";
    msg.innerText = "";
    for (let i = 0; i < 9; i = i + 1) document.getElementById("h" + i).innerText = "";
    moleTimer  = setInterval(showMole, 800);
    clockTimer = setInterval(countDown, 1000);
  };
<\/script>

</body>
</html>`]],

<script>

  const item      = document.getElementById("item");

    player.style.left = x + "px";
    player.style.top  = y + "px";

  function moveItem() {
    item.style.left = Math.floor(Math.random() * 460) + "px";
    item.style.top  = Math.floor(Math.random() * 360) + "px";
  }

  document.addEventListener("keydown", function (e) {
    if (playing === false) return;

    // ━━━━━━━━━━ 빈칸 ① ━━━━━━━━━━

    if (e.key === "ArrowUp"    || e.key === "") y = y - 20;

    if (x < 0)   x = 0;
    if (x > 460) x = 460;
    if (y < 0)   y = 0;
    if (y > 360) y = 360;

    draw();
    checkItem();
  });

  function checkItem() {
    const ix = parseInt(item.style.left);
    const iy = parseInt(item.style.top);

    if (Math.abs(x - ix) < 40 && Math.abs(y - iy) < 40) {
      score = score + 1;
      scoreText.innerText = score;
      moveItem();

  ["📝 dodge2.html  ─ 🔥 도전 빈칸 코드 (이걸 복사하세요!)", `<!doctype html>

    rock.dataset.star = isStar ? "1" : "0";

    scoreText.innerText = 0;
    over.style.display = "none";

    gameTimer = setInterval(update, 30);
    makeTimer = setInterval(makeRock, 700);

    speedTimer = setInterval(function () {

      // ━━━━━━━━━━ 빈칸 ② ━━━━━━━━━━
      // 아래 0 을 1 로 바꾸면 5초마다 조금씩 빨라집니다
      speed = speed + 0;

    }, 5000);
  }

  document.getElementById("again").onclick = start;
  start();
<\/script>

</body>
</html>`]],

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뽑기 앱</title>
<style>
  :root {
    --main: #2563eb;          /* ③ 우리 팀 색 */
    --bg:   #eef2f7;
  }

  .addbar { display: flex; gap: 8px; }
  .addbar input { flex: 1; font-size: 16px; padding: 12px; border: 2px solid #e2e8f0;
                  border-radius: 10px; font-family: inherit; }
  .addbar input:focus { outline: none; border-color: var(--main); }
  .addbar button { font-size: 16px; padding: 12px 18px; border: 0; border-radius: 10px;
                   background: var(--main); color: white; cursor: pointer; }

  ul { list-style: none; margin: 14px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px;
       border-bottom: 1px solid #f1f5f9; font-size: 16px; }
  li span { flex: 1; }
  li button { border: 0; background: #fee2e2; color: #dc2626; cursor: pointer;
              border-radius: 8px; padding: 6px 11px; font-size: 14px; }
  .empty { color: #94a3b8; text-align: center; padding: 18px 0; font-size: 15px; }

  #pickBtn { width: 100%; font-size: 21px; font-weight: bold; padding: 18px;
             border: 0; border-radius: 14px; background: var(--main); color: white;
             cursor: pointer; }
  #pickBtn:active { transform: scale(.98); }

  #result { text-align: center; font-size: 34px; font-weight: bold; min-height: 52px;
            color: var(--main); margin-top: 6px; }
  #count { text-align: center; color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>

<div class="app">

  <!-- ━━━ ① 제목을 우리 앱으로 바꾸세요 ━━━ -->
  <h1>🍚 오늘 뭐 먹지</h1>
  <p class="sub">버튼을 누르면 하나를 뽑아 줍니다</p>

  <div class="box">
    <div class="addbar">
      <input id="newItem" placeholder="항목을 입력하세요">
      <button id="addBtn">추가</button>
    </div>
    <ul id="list"></ul>
    <p id="count"></p>
  </div>

  <div class="box">
    <button id="pickBtn">🎲 뽑기!</button>
    <div id="result"></div>
  </div>

</div>

<script>
  // ━━━ ② 우리 주제에 맞는 목록으로 바꾸세요 ━━━
  let items = ["김치찌개", "돈까스", "떡볶이", "제육덮밥", "라면"];

  const listEl   = document.getElementById("list");
  const countEl  = document.getElementById("count");
  const inputEl  = document.getElementById("newItem");
  const resultEl = document.getElementById("result");

  // 목록을 화면에 그리는 함수 — 목록이 바뀔 때마다 부릅니다
  function draw() {
    listEl.innerHTML = "";

    if (items.length === 0) {
      listEl.innerHTML = "<p class='empty'>항목을 추가해 주세요</p>";
    }

    for (let i = 0; i < items.length; i = i + 1) {
      const li = document.createElement("li");

      const text = document.createElement("span");
      text.innerText = items[i];

      const del = document.createElement("button");
      del.innerText = "삭제";
      del.onclick = function () {
        items.splice(i, 1);     // i번째를 1개 지운다
        draw();
      };

      li.appendChild(text);
      li.appendChild(del);
      listEl.appendChild(li);
    }

    countEl.innerText = "모두 " + items.length + "개";
  }

  // 추가 버튼
  document.getElementById("addBtn").onclick = function () {
    const value = inputEl.value;      // 입력창에 쓴 글자를 가져온다

    if (value === "") {
      alert("먼저 내용을 입력하세요!");
      return;
    }

    items.push(value);                // 목록 맨 뒤에 넣는다
    inputEl.value = "";               // 입력창 비우기
    draw();
  };

  // 입력창에서 Enter 를 눌러도 추가되게
  inputEl.onkeydown = function (e) {
    if (e.key === "Enter") document.getElementById("addBtn").onclick();
  };

  // 뽑기 버튼
  document.getElementById("pickBtn").onclick = function () {
    if (items.length === 0) {
      resultEl.innerText = "목록이 비었어요";
      return;
    }

    const n = Math.floor(Math.random() * items.length);
    resultEl.innerText = items[n];
  };

  draw();
<\/script>

</body>
</html>`, "① 뽑기"],
  ["② 퀴즈형  ─ quiz.html  (퀴즈 · 테스트 · 상식)", `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀴즈 앱</title>
<style>
  :root {
    --main: #7c3aed;          /* ③ 우리 팀 색 */
    --bg:   #f5f3ff;
  }
  body { font-family: sans-serif; background: var(--bg); margin: 0;
         padding: 24px 16px 60px; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 460px; }
  h1 { font-size: 27px; text-align: center; margin: 0 0 18px; }

  .box { background: white; border-radius: 16px; padding: 22px;
         box-shadow: 0 4px 16px rgba(0,0,0,.07); }

  .bar { height: 9px; background: #ede9fe; border-radius: 99px; overflow: hidden;
         margin-bottom: 16px; }
  .bar div { height: 100%; width: 0; background: var(--main); transition: width .25s; }

  .no { color: #a78bfa; font-size: 14px; font-weight: bold; }
  #question { font-size: 20px; font-weight: bold; margin: 8px 0 20px; line-height: 1.5; }

  .choices { display: flex; flex-direction: column; gap: 9px; }
  .choices button { font-size: 16px; padding: 15px; border: 2px solid #e9e5ff;
                    border-radius: 12px; background: white; cursor: pointer;
                    text-align: left; font-family: inherit; }
  .choices button:hover { border-color: var(--main); }
  .choices button.right { background: #dcfce7; border-color: #16a34a; }
  .choices button.wrong { background: #fee2e2; border-color: #dc2626; }

  #mark { text-align: center; font-size: 19px; font-weight: bold; min-height: 30px;
          margin-top: 16px; }

  /* 결과 화면 — 처음에는 숨어 있습니다 */
  #endScreen { display: none; text-align: center; }
  #endScreen .em { font-size: 64px; }
  #endScreen h2 { font-size: 24px; margin: 6px 0; }
  #endScreen p { color: #64748b; margin: 0 0 20px; }
  #again { font-size: 17px; padding: 14px 32px; border: 0; border-radius: 12px;
           background: var(--main); color: white; cursor: pointer; }
</style>
</head>
<body>

<div class="app">

  <!-- ━━━ ① 제목을 우리 앱으로 바꾸세요 ━━━ -->
  <h1>🧠 우리 반 퀴즈</h1>

  <div class="box">

    <div id="playScreen">
      <div class="bar"><div id="barFill"></div></div>
      <div class="no" id="no"></div>
      <div id="question"></div>
      <div class="choices" id="choices"></div>
      <div id="mark"></div>
    </div>

    <div id="endScreen">
      <div class="em" id="endEmoji">🎉</div>
      <h2 id="endTitle"></h2>
      <p id="endScore"></p>
      <button id="again">다시 풀기</button>
    </div>

  </div>
</div>

<script>
  // ━━━ ② 문제를 우리 것으로 바꾸세요 ━━━
  //     answer 는 정답이 몇 번째인지 (맨 앞이 0)
  const quiz = [
    { q: "우리 학교 교훈의 첫 글자는?",
      choices: ["성", "정", "창", "근"], answer: 1 },

    { q: "종이컵은 어디에 버려야 할까요?",
      choices: ["일반쓰레기", "플라스틱", "종이류", "캔류"], answer: 2 },

    { q: "1교시 시작은 몇 시일까요?",
      choices: ["8시 30분", "8시 50분", "9시 00분", "9시 10분"], answer: 1 }
  ];

  let index = 0;     // 지금 몇 번째 문제인가
  let score = 0;     // 맞힌 개수
  let locked = false;  // 답을 고른 뒤 또 못 누르게

  const noEl       = document.getElementById("no");
  const questionEl = document.getElementById("question");
  const choicesEl  = document.getElementById("choices");
  const markEl     = document.getElementById("mark");
  const barFill    = document.getElementById("barFill");

  function showQuestion() {
    locked = false;
    markEl.innerText = "";

    const item = quiz[index];
    noEl.innerText = "문제 " + (index + 1) + " / " + quiz.length;
    questionEl.innerText = item.q;
    barFill.style.width = (index / quiz.length * 100) + "%";

    choicesEl.innerHTML = "";
    for (let i = 0; i < item.choices.length; i = i + 1) {
      const btn = document.createElement("button");
      btn.innerText = item.choices[i];
      btn.onclick = function () { choose(i, btn); };
      choicesEl.appendChild(btn);
    }
  }

  function choose(picked, btn) {
    if (locked) return;
    locked = true;

    if (picked === quiz[index].answer) {
      score = score + 1;
      btn.className = "right";
      markEl.innerText = "⭕ 정답!";
    } else {
      btn.className = "wrong";
      markEl.innerText = "❌ 땡! 정답은 " + quiz[index].choices[quiz[index].answer];
    }

    // 1.2초 뒤에 다음 문제로
    setTimeout(next, 1200);
  }

  function next() {
    index = index + 1;

    if (index < quiz.length) {
      showQuestion();
    } else {
      showEnd();
    }
  }

  function showEnd() {
    // 화면 바꾸기 — 하나는 숨기고 하나는 보이게
    document.getElementById("playScreen").style.display = "none";
    document.getElementById("endScreen").style.display = "block";

    document.getElementById("endScore").innerText =
      quiz.length + "문제 중 " + score + "개 정답";

    // ━━━ ③ 등급 기준을 우리 마음대로 바꾸세요 ━━━
    if (score === quiz.length) {
      document.getElementById("endEmoji").innerText = "🏆";
      document.getElementById("endTitle").innerText = "만점! 대단해요";
    } else if (score >= quiz.length / 2) {
      document.getElementById("endEmoji").innerText = "😎";
      document.getElementById("endTitle").innerText = "잘했어요!";
    } else {
      document.getElementById("endEmoji").innerText = "😅";
      document.getElementById("endTitle").innerText = "다시 도전!";
    }
  }

  document.getElementById("again").onclick = function () {
    index = 0;
    score = 0;
    document.getElementById("playScreen").style.display = "block";
    document.getElementById("endScreen").style.display = "none";
    showQuestion();
  };

  showQuestion();
<\/script>

</body>
</html>`, "② 퀴즈"],

</head>
<body>

<div class="app">

  <!-- ━━━ ① 제목을 우리 앱으로 바꾸세요 ━━━ -->
  <h1>🗳️ 우리 반 투표</h1>
  <p class="sub">버튼을 누르면 한 표가 올라갑니다</p>

  <div class="box" id="board"></div>

  <div class="box">
    <p id="total"></p>
    <p id="winner"></p>
    <button id="reset">처음부터 다시</button>
  </div>

</div>

<script>
  // ━━━ ② 투표 항목을 우리 것으로 바꾸세요 ━━━
  //     votes 는 시작 표 수입니다 (보통 0)
  let items = [
    { icon: "🍕", name: "피자",   votes: 0 },
    { icon: "🍗", name: "치킨",   votes: 0 },
    { icon: "🍔", name: "햄버거", votes: 0 },
    { icon: "🍜", name: "라면",   votes: 0 }
  ];

  const board    = document.getElementById("board");
  const totalEl  = document.getElementById("total");
  const winnerEl = document.getElementById("winner");

  function draw() {
    // 가장 많은 표가 몇 표인지 찾기 (막대 길이 기준)
    let max = 0;
    let sum = 0;
    for (let i = 0; i < items.length; i = i + 1) {
      sum = sum + items[i].votes;
      if (items[i].votes > max) max = items[i].votes;
    }

    board.innerHTML = "";

    for (let i = 0; i < items.length; i = i + 1) {
      const it = items[i];

      const row = document.createElement("div");
      row.className = "row";

      // 막대 길이 = 내 표 / 1등 표 × 100%
      let percent = 0;
      if (max > 0) percent = it.votes / max * 100;

      row.innerHTML =
        '<div class="top">' +
          '<span class="ic">' + it.icon + "</span>" +
          '<span class="nm">' + it.name + "</span>" +
          '<span class="num">' + it.votes + "표</span>" +
        "</div>" +
        '<div class="track"><div class="fill" style="width:' + percent + '%"></div></div>';

      const btn = document.createElement("button");
      btn.className = "voteBtn";
      btn.innerText = "투표하기";
      btn.onclick = function () {
        items[i].votes = items[i].votes + 1;
        draw();
      };

      row.appendChild(btn);
      board.appendChild(row);
    }

    totalEl.innerText = "지금까지 " + sum + "표";

    // 1등 표시 — 아직 아무도 안 눌렀으면 비워 둡니다
    if (sum === 0) {
      winnerEl.innerText = "";
    } else {
      let best = items[0];
      for (let i = 0; i < items.length; i = i + 1) {
        if (items[i].votes > best.votes) best = items[i];
      }
      winnerEl.innerText = "🏆 1등 : " + best.icon + " " + best.name;
    }
  }

  document.getElementById("reset").onclick = function () {
    for (let i = 0; i < items.length; i = i + 1) {
      items[i].votes = 0;
    }
    draw();
  };

  draw();
<\/script>

  body.resting #startBtn { background: var(--rest); }
  #resetBtn { background: #e2e8f0; color: #475569; }

  #stamps { font-size: 24px; letter-spacing: 4px; min-height: 32px; }
</style>
</head>
<body>

<div class="app">

  <!-- ━━━ ① 제목을 우리 앱으로 바꾸세요 ━━━ -->
  <h1>🍅 집중 타이머</h1>

  <div class="box">
    <div id="phase">집중 시간</div>
    <div id="clock">25:00</div>
    <div class="ring"><div id="ringFill"></div></div>

    <div class="btns">
      <button id="startBtn">시작</button>
      <button id="resetBtn">리셋</button>
    </div>

    <div id="done">오늘 끝낸 집중</div>
    <div id="stamps"></div>
  </div>

</div>

<script>
  // ━━━ ② 시간을 우리가 원하는 대로 바꾸세요 (단위: 초) ━━━
  const FOCUS = 25 * 60;    // 집중 25분
  const REST  =  5 * 60;    // 휴식 5분

  let left    = FOCUS;      // 남은 초
  let resting = false;      // 지금 쉬는 시간인가
  let running = false;      // 지금 돌아가는 중인가
  let rounds  = 0;          // 집중을 몇 번 끝냈나
  let timer;

  const clockEl  = document.getElementById("clock");
  const phaseEl  = document.getElementById("phase");
  const ringFill = document.getElementById("ringFill");
  const startBtn = document.getElementById("startBtn");
  const stampsEl = document.getElementById("stamps");

  // 125초 → "02:05" 처럼 보기 좋게 만드는 함수
  function two(n) {
    if (n < 10) return "0" + n;
    return "" + n;
  }
  function format(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return two(m) + ":" + two(s);
  }

  function draw() {
    clockEl.innerText = format(left);

    const whole = resting ? REST : FOCUS;
    ringFill.style.width = (left / whole * 100) + "%";

    if (resting) {
      phaseEl.innerText = "쉬는 시간";
      document.body.className = "resting";
    } else {
      phaseEl.innerText = "집중 시간";
      document.body.className = "";
    }

    startBtn.innerText = running ? "잠깐 멈춤" : "시작";

    // ━━━ ③ 도장 모양을 바꿔도 좋아요 ━━━
    stampsEl.innerText = "🍅".repeat(rounds);
  }

  function tick() {
    left = left - 1;

    if (left <= 0) {
      // 한 단계가 끝났습니다 — 집중↔휴식 바꾸기
      if (resting === false) {
        rounds = rounds + 1;
        resting = true;
        left = REST;
        alert("집중 끝! 쉬는 시간이에요 ☕");
      } else {
        resting = false;
        left = FOCUS;
        alert("쉬는 시간 끝! 다시 집중해 볼까요 💪");
      }
    }

    draw();
  }

  startBtn.onclick = function () {
    if (running) {
      clearInterval(timer);
      running = false;
    } else {
      timer = setInterval(tick, 1000);
      running = true;
    }
    draw();
  };

  document.getElementById("resetBtn").onclick = function () {
    clearInterval(timer);
    running = false;
    resting = false;
    left = FOCUS;
    draw();
  };

  draw();
<\/script>

</body>

<body>

  // ━━━ ② 카드 내용을 우리 것으로 바꾸세요 (앞면 / 뒷면) ━━━
  let cards = [
    { front: "apple",   back: "사과" },
    { front: "school",  back: "학교" },
    { front: "friend",  back: "친구" },

    { front: "library", back: "도서관" }

  let index = 0;        // 지금 몇 번째 카드인가
  let flipped = false;  // 뒤집혀 있나

  const faceEl = document.getElementById("face");
  const hintEl = document.getElementById("hint");
  const posEl  = document.getElementById("pos");
  const doneEl = document.getElementById("done");

  function draw() {
    posEl.innerText = (index + 1) + " / " + cards.length;

    if (flipped) {
      faceEl.innerText = cards[index].back;
      hintEl.innerText = "뒷면 — 눌러서 되돌리기";
      cardEl.className = "back";

  };

  document.getElementById("next").onclick = function () {
    index = index + 1;
    if (index >= cards.length) index = 0;   // 끝이면 처음으로

    draw();
  };

  document.getElementById("prev").onclick = function () {
    index = index - 1;
    if (index < 0) index = cards.length - 1;  // 처음이면 끝으로
    flipped = false;
    draw();
  };

  // 카드 순서를 무작위로 섞는다
  document.getElementById("shuffle").onclick = function () {

    flipped = false;
    draw();
    doneEl.innerText = "카드를 섞었어요!";

<script>
  // ━━━ ② 우리 주제에 맞는 항목으로 바꾸세요 ━━━

  const pctEl  = document.getElementById("pct");

function isDone(n, i){ return !!(prog[n] && prog[n][i]); }

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* HTML · CSS · JS 한 파일을 함께 칠하는 간단 하이라이터 */
function hl(src){
  const re = new RegExp([
    "(<!--[\\s\\S]*?-->)",              // 1 HTML 주석
    "(/\\*[\\s\\S]*?\\*/)",             // 2 CSS 주석
    "(//[^\\n]*)",                      // 3 JS 주석
    '("(?:[^"\\\\]|\\\\.)*")',          // 4 문자열
    "(</?[a-zA-Z][\\w-]*)",             // 5 HTML 태그
    "\\b(let|const|var|function|if|else|return|for|while|true|false|null|new|typeof)\\b", // 6 키워드
    "\\b(document|window|Math|console|alert|setInterval|setTimeout|clearInterval|" +
      "parseInt|getElementById|querySelector|querySelectorAll|addEventListener|" +
      "createElement|appendChild|innerText|innerHTML|style|push|splice|remove|" +
      "length|floor|random|abs|onclick|disabled|className|Audio)\\b"                      // 7 내장 기능
  ].join("|"), "g");

  let out = "", last = 0, m;
  while ((m = re.exec(src)) !== null){
    out += esc(src.slice(last, m.index));
    if (m[1] || m[2] || m[3]) out += '<span class="cm">' + esc(m[1] || m[2] || m[3]) + "</span>";
    else if (m[4]) out += '<span class="st">' + esc(m[4]) + "</span>";
    else if (m[5]) out += '<span class="ty">' + esc(m[5]) + "</span>";
    else if (m[6]) out += '<span class="kw">' + m[6] + "</span>";
    else           out += '<span class="fn">' + m[7] + "</span>";
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* 코드 블록이 다른 차시에 있어도 찾아가서 펼친다 */
function gotoCode(stageN, find){
  const open = function(){
    const re = new RegExp("(^|\\s)" + find + "(\\s|·|$)");
    const codes = [].slice.call(document.querySelectorAll(".cf"));
    for (let i = 0; i < codes.length; i = i + 1){
      if (re.test(codes[i].querySelector("summary b").textContent)){
        codes[i].open = true;
        const y = codes[i].getBoundingClientRect().top + window.scrollY - 92;
        window.scrollTo({ top: y, behavior: "smooth" });
        return;
      }
    }
  };
  if (view === stageN) open();
  else { tab = "home"; view = stageN; render(); setTimeout(open, 50); }
}

/* 미션 글을 읽고 어디로 보낼지 정한다 (최대 2개) */
function questGo(){
  const lis   = [].slice.call(document.querySelectorAll(".quests li"));
  const codes = [].slice.call(document.querySelectorAll(".cf"));
  const secs  = [].slice.call(document.querySelectorAll(".body section"));

  const HOME = { P1:5, P2:5, P3:6, P4:6, P5:6, P6:7, P7:6, P8:6 };   // 프롬프트가 있는 차시

  function hasCode(find){
    const re = new RegExp("(^|\\s)" + find + "(\\s|·|$)");
    for (let i = 0; i < codes.length; i = i + 1){
      if (re.test(codes[i].querySelector("summary b").textContent)) return true;
    }
    return false;
  }
  function secIndex(word){
    for (let i = 0; i < secs.length; i = i + 1){
      const h = secs[i].querySelector(".sec-h h2");
      if (!h) continue;
      if (h.textContent.indexOf(word) >= 0) return i;
      // '오늘의 코드' 를 찾을 때 '오늘의 프롬프트' 도 같은 칸으로 봅니다
      if (word === "오늘의 코드" && h.textContent.indexOf("오늘의 프롬프트") >= 0) return i;
    }
    return -1;
  }
  function codeBtn(find, label, home){
    const here = hasCode(find);
    const st = here ? view : home;
    if (!here && !home) return "";
    const tail = here ? "" : " (" + (st + 6) + "차시)";
    return '<button class="qgo" data-goto="' + st + '" data-find="' + find + '">→ ' +
           label + tail + "</button>";
  }
  function secBtn(word, label){
    const i = secIndex(word);
    return i < 0 ? "" : '<button class="qgo" data-sec="' + i + '">→ ' + label + "</button>";
  }

  lis.forEach(function(li){
    if (li.querySelector(".qgo")) return;
    const qt = li.querySelector(".qt");
    if (!qt) return;
    const t = qt.textContent;
    const made = [];

    const p = t.match(/\bP([1-8])\b/);
    if (p) made.push(codeBtn("P" + p[1], "P" + p[1] + " 보기", HOME["P" + p[1]]));

    const r = t.match(/\bR(10|[1-9])\b/);
    if (r) made.push(codeBtn("R" + r[1], "R" + r[1] + " 보기", 6));

    if (t.indexOf("제출") >= 0) made.push(secBtn("작품 제출", "제출 방법"));
    if (t.indexOf("체험장") >= 0) made.push(codeBtn("체험장", "체험장 열기", 6));
    if (t.indexOf("템플릿") >= 0 || t.indexOf("뼈대") >= 0) made.push(secBtn("오늘의 코드", "템플릿 보기"));
    if (t.indexOf("생성기") >= 0) made.push(secBtn("프롬프트 생성기", "생성기 열기"));
    if (t.indexOf("기획서") >= 0) made.push(secBtn("기획서", "기획서 표"));
    if (t.indexOf("기록표") >= 0) made.push(secBtn("활용 기록표", "기록표"));
    if (!made.length && t.indexOf("레시피") >= 0) made.push(secBtn("오늘의 코드", "레시피 보기"));

    const keep = made.filter(function(x){ return x; }).slice(0, 2);
    if (keep.length) qt.insertAdjacentHTML("beforeend", keep.join(""));
  });
}

/* 지금 차시에 어떤 칸이 있는지 모아 바로가기 버튼을 만든다 */
function navLabel(t){
  const m = t.match(/\(([^)]+)\)\s*$/);
  if (m){
    const head = t.slice(0, t.indexOf("(")).trim().split(" ")[0];
    return (head + " " + m[1]).trim();
  }
  let x = t.split("—")[0].replace(/\s+/g, " ").trim();
  if (x.length > 15) x = x.slice(0, 14) + "…";
  return x;
}
function buildJump(){
  const box = document.getElementById("jump");
  if (!box) return;
  const secs = [].slice.call(document.querySelectorAll(".body section"));
  const out = [];
  secs.forEach(function(sc, i){
    sc.dataset.j = i;
    const h = sc.querySelector(".sec-h h2");
    let label = "";
    if (h){
      if (h.textContent.indexOf("오늘의 미션") >= 0) return;   // 지금 여기
      label = navLabel(h.textContent);
    } else if (sc.querySelector(".chal")) {
      label = "🔥 오늘의 도전";
    } else if (sc.querySelector(".ans")) {
      label = "🔒 도전 정답";
    } else {
      return;
    }
    out.push('<button class="jchip" data-j="' + i + '">' + esc(label) + "</button>");
  });
  box.innerHTML = out.length ? '<span class="jl">바로가기</span>' + out.join("") : "";
}

function genRead(key){
  const row = document.querySelector('.gchips[data-g="' + key + '"]');
  if (!row) return [];
  return [].slice.call(row.querySelectorAll('.gchip[aria-pressed="true"]'))
           .map(function(b){ return b.dataset.v; });
}

/* 코드 블록을 버튼으로 골라 펼치게 만든다 */
function shortLabel(t){
  let x = t.replace(/\([^)]*\)/g, "").replace(/\s+/g, " ").trim();
  if (x.length > 20) x = x.slice(0, 19) + "…";
  return x;
}
function codeHTML(list){
  const chips = '<div class="chips">' + list.map(function(c, i){
    return '<button class="chip" data-code="' + i + '">' +
           esc(c[2] || shortLabel(c[0])) + "</button>";
  }).join("") + "</div>";

  const body = list.map(function(c, i){
    const hint = c[0].indexOf("정답") >= 0
      ? "<em>스스로 해본 다음에 열어 주세요</em>" : "";
    const runnable = c[1].indexOf("<!doctype html>") === 0;
    const play = runnable
      ? '<div class="try"><div class="try-top"><b>▶ 직접 해보기</b>' +
        "<em>코드가 실제로 어떻게 움직이는지 눌러 보세요</em>" +
        '<button class="trybtn">실행</button></div>' +
        '<div class="try-box"></div></div>'
      : "";
    // 먼저 눌러보고(실습), 그다음 코드를 봅니다
    const inner = play + slabHTML(c[0], c[1]);
    return '<details class="cf"><summary><b>' + esc(c[0]) + "</b>" + hint +
           '</summary><div class="cf-body">' + inner + "</div></details>";
  }).join("");

  return chips + '<div class="cfs">' + body + "</div>";
}

/* 처음엔 접혀 있는 '정답' 블록 */
function foldHTML(title, hint, inner){
  return '<details class="ans"><summary><b>' + title + "</b>" +
         (hint ? "<em>" + hint + "</em>" : "") + "</summary>" +
         '<div class="ans-body">' + inner + "</div></details>";
}

function renderGauge(){
  const d = doneCount();
  const p = TOTAL ? Math.round(d / TOTAL * 100) : 0;
  document.getElementById("ring").setAttribute("stroke-dashoffset", CIRC * (1 - p / 100));
  document.getElementById("pct").textContent = p + "%";
}

        "<li><b>5분 넘게 막히면 손을 드세요.</b> 🙋</li></ul></div>") +
      sec("내 진행 상황", "",
        '<p style="color:var(--ink-2);font-size:.93rem;margin:0 0 12px">체크한 미션은 이 브라우저에 저장됩니다. ' +
        "현재 <b>" + doneCount() + " / " + TOTAL + "</b> 개 완료.</p>" +
        '<button class="reset" id="reset">진행 상황 초기화</button>') +
    "</div></div>";
}

function stageHTML(s){
  const idx = STAGES.indexOf(s);
  const prev = STAGES[idx - 1], next = STAGES[idx + 1];

  let h = '<div class="flowbar jump" id="jump"></div>' +
    '<div class="card pane"><div class="head">' +
    '<div class="eyebrow">' +
      '<span class="pill stg">STAGE ' + String(s.n).padStart(2, "0") + "</span>" +
      '<span class="pill date">' + s.date + (s.date.indexOf("/") >= 0 ? " (월) 16:50–17:50" : "") + "</span>" +
      '<span class="pill lv' + s.lv + '">' + s.lvName + "</span>" +
      (stageDone(s.n) ? '<span class="pill lv1">✓ 클리어</span>' : "") +
    "</div><h1>" + s.title + "</h1><p>" + s.sub + "</p></div><div class=\"body\">" +
    '';

  if (s.install && s.install.length)
    h += sec("⬇️ 유니티 설치, 8단계", "순서대로 따라오세요",
          '<div class="card2"><div class="steps">' + s.install.map((st, i) =>
            '<div class="step"><span class="sn">' + (i + 1) + "</span>" +
            "<span><b>" + st[0] + "</b><p>" + st[1] + "</p></span></div>").join("") + "</div></div>");

  if (s.learn && s.learn.length)
    h += sec("📖 오늘 알아야 할 것", "읽고 넘어가면 미션이 쉬워집니다",
          '<div class="learn">' + s.learn.map((l, i) =>
            '<div class="lc"><span class="k">' + String(i + 1).padStart(2, "0") + "</span><b>" +
            l[0] + "</b><p>" + l[1] + "</p></div>").join("") + "</div>", "t-learn");

  h += sec("🎯 오늘의 미션", "하나씩 누르며 체크하세요",
        '<ul class="quests">' + s.quests.map((q, i) =>
          '<li><div class="q" role="button" tabindex="0" data-n="' + s.n + '" data-i="' + i + '" aria-pressed="' + isDone(s.n, i) + '">' +
          '<span class="bx">✓</span><span class="qn">' + String(i + 1).padStart(2, "0") + "</span>" +
          '<span class="qt">' + q + "</span></div></li>").join("") + "</ul>", "t-quest");

  if (s.submit && s.submit.length)
    h += sec("📤 작품 제출하는 법", "이대로만 따라오면 됩니다",
          '<div class="card2"><div class="steps">' + s.submit.map((st, i) =>
            '<div class="step"><span class="sn">' + (i + 1) + "</span>" +
            "<span><b>" + st[0] + "</b><p>" + st[1] + "</p></span></div>").join("") + "</div></div>",
          "t-quest");

  if (s.upgrade){
    const u = s.upgrade;
    const udone = u.items.filter((_, i) => isDone(s.n, "u" + i)).length;
    h += sec("🧰 기능 업그레이드 — " + u.items.length + "가지 중 " + u.goal + "가지 고르기",
      "넣었다가 아니라 '해 보고 됐다' 를 체크하세요",
      '<div class="upg' + (udone >= u.goal ? " clear" : "") + '">' +
        '<div class="upg-top"><b>🧰 우리가 고른 기능</b>' +
          '<span class="rw">· 어떤 앱에든 어울리는 것만 모았습니다</span>' +
          '<span class="ucnt"><span class="ud">' + udone + "</span> / " + u.goal + " 완료</span>" +
        "</div>" +
        '<div class="upg-body">' + u.items.map((c, i) =>
          '<button class="uq" data-n="' + s.n + '" data-u="' + i + '" aria-pressed="' +
          isDone(s.n, "u" + i) + '"><span class="bx">✓</span><span class="ut"><b>' +
          c[0] + "</b><em>" + c[1] + "</em></span></button>").join("") +
        "</div>" +
        '<div class="ureward">🎉 ' + u.goal + "가지 완료! 이제 사용감과 디자인을 올릴 차례입니다</div>" +
      "</div>", "t-quest");
  }

  if (s.gen){
    h += sec("📝 우리 팀 기획 카드", "적어 두면 아래 생성기에 자동으로 들어갑니다", planHTML(), "t-quest");
    h += sec("🪄 프롬프트 생성기", "고르기만 하면 질문이 완성됩니다", genHTML(), "t-gen");
  }

  if (s.code && s.code.length){
    // 전부 프롬프트면 제목을 바꿔 줍니다
    const onlyPrompt = s.code.every(c => c[0].indexOf("🤖") >= 0);
    h += sec(onlyPrompt ? "🤖 오늘의 프롬프트" : "💻 오늘의 코드",
          onlyPrompt ? "버튼을 누르면 질문이 열립니다 — 복사해서 AI에 넣으세요"
                     : "아래 버튼을 누르면 그 코드가 열립니다",
          codeHTML(s.code), "t-code");
  }

  // 표는 문장이 길어서 나란히 놓으면 가로 스크롤이 생깁니다 — 전체 폭으로
  if (s.tables)
    s.tables.forEach(t => { h += '<section class="sec t-table">' + tableHTML(t) + "</section>"; });

  if (s.links && s.links.length)
    h += sec(s.linksTitle || "🔗 링크", "새 탭으로 열립니다",
          '<div class="links">' + s.links.map(l =>
            '<a class="lk" href="' + l[2] + '" target="_blank" rel="noopener">' +
            '<span class="lt"><b>' + l[0] + "</b><i>" + l[1] + "</i><em>" + l[3] + "</em></span>" +
            '<span class="ar">↗</span></a>').join("") + "</div>");

  if (s.notes && s.notes.length)
    h += sec("🆘 막히면 여기", "", '<div class="notes">' + s.notes.map(noteHTML).join("") + "</div>", "t-help");

  const ch = s.challenge ||
    (s.bonus && s.bonus.length ? { items: s.bonus.map(b => [b, ""]) } : null);

  if (ch) {
    const reward = ch.reward || "쉬는시간 + 간식 🍪";
    const done = ch.items.filter((_, i) => isDone(s.n, "c" + i)).length;
    h += sec("", "",
      '<div class="chal' + (done === ch.items.length ? " clear" : "") + '" data-ch="' + s.n + '">' +
        '<div class="chal-top"><span class="fire">🔥</span>' +
          "<b>오늘의 도전</b>" +
          '<span class="rw">· 다 하면 ' + reward + "</span>" +
          '<span class="cnt"><span class="cd">' + done + "</span> / " + ch.items.length + " 완료</span>" +
        "</div>" +
        (ch.howto ? '<p class="howto">📝 ' + ch.howto + "</p>" : "") +
        '<div class="chal-body">' + ch.items.map((c, i) =>
          '<button class="cq" data-n="' + s.n + '" data-c="' + i + '" aria-pressed="' +
          isDone(s.n, "c" + i) + '"><span class="bx">✓</span><span class="ct"><b>' +
          c[0] + "</b>" + (c[1] ? "<em>" + c[1] + "</em>" : "") + "</span></button>").join("") +
        "</div>" +
        '<div class="reward">🎉 도전 완료! ' + reward +
          "<span>선생님께 보여드리고 받아 가세요</span></div>" +
      "</div>");

    if (s.answer && s.answer.length)
      h += sec("", "", foldHTML("도전 정답 보기",
            "4개 다 해본 다음에 열어 주세요",
            s.answer.map(c => slabHTML(c[0], c[1])).join("")));
  }

  h += '<div class="nav">' +
    (prev ? '<button data-go="' + prev.n + '"><span>← 이전 차시</span>' + prev.title + "</button>"
          : '<button data-go="home"><span>←</span>코스 안내</button>') +
    (next ? '<button class="r" data-go="' + next.n + '"><span>다음 차시 →</span>' + next.title + "</button>"
          : '<button class="r" disabled><span>끝!</span>수고했어요 :D</button>') +
    "</div></div></div>";
  return h;
}

function cheatHTML(){
  let h = '<div class="card pane"><div class="head">' +
    '<div class="eyebrow"><span class="pill stg">CHEAT SHEET</span></div>' +
    "<h1>" + CHEAT.title + "</h1><p>" + CHEAT.sub + "</p></div><div class=\"body\">";
  h += sec("🔗 코드 가져오기", "누르면 그 차시로 이동합니다",
        '<div class="links">' + CHEAT.links.map(l => {
          const stage = (l[2].match(/stage(\d+)/) || [])[1];
          const open = stage ? '<button class="lk" data-go="' + stage + '">'
                             : '<a class="lk" href="' + l[2] + '" target="_blank" rel="noopener">';
          const close = stage ? "</button>" : "</a>";
          return open + '<span class="lt"><b>' + l[0] + "</b><i>" + l[1] + "</i><em>" + l[3] +
                 "</em></span><span class=\"ar\">" + (stage ? "›" : "↗") + "</span>" + close;
        }).join("") + "</div>");
  CHEAT.notes.forEach(n => { h += '<section class="sec">' + noteHTML(n) + "</section>"; });
  CHEAT.tables.forEach(t => { h += '<section class="sec">' + tableHTML(t) + "</section>"; });
  h += "</div></div>";
  return h;
}

function render(){
  // 생성기가 있으면 그릴 때마다 질문을 새로 만든다
  setTimeout(function(){ genBuild(); buildJump(); questGo(); }, 0);
  CODES.length = 0;
  document.querySelector(".rail").style.display = tab === "cheat" ? "none" : "";
  document.querySelector(".wrap").style.gridTemplateColumns =
    tab === "cheat" ? "minmax(0,1fr)" : "";
  mainEl.style.maxWidth = tab === "cheat" ? "880px" : "";
  mainEl.style.margin   = tab === "cheat" ? "0 auto" : "";
  if (tab === "cheat")      mainEl.innerHTML = cheatHTML();
  else if (view === "home") mainEl.innerHTML = homeHTML();
  else                      mainEl.innerHTML = stageHTML(STAGES.find(s => s.n === view));
  renderRail();
  renderGauge();
  document.getElementById("tab-home").setAttribute("aria-selected", tab === "home");
  document.getElementById("tab-cheat").setAttribute("aria-selected", tab === "cheat");
}

/* ══════════════════════════════════════════════════════════
   이벤트
   ══════════════════════════════════════════════════════════ */
function go(target){
  tab  = "home";
  view = target === "home" ? "home" : Number(target);
  location.hash = target === "home" ? "" : "stage" + target;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.addEventListener("click", e => {
  const goBtn = e.target.closest("[data-go]");
  if (goBtn) { go(goBtn.dataset.go); return; }

  const qg = e.target.closest(".qgo");
  if (qg){
    if (qg.dataset.find !== undefined){
      gotoCode(Number(qg.dataset.goto), qg.dataset.find);
    } else {
      const sc = document.querySelector('.body section[data-j="' + qg.dataset.sec + '"]');
      if (sc){
        const y = sc.getBoundingClientRect().top + window.scrollY - 92;
        window.scrollTo({ top: y, behavior: "smooth" });
      }
    }
    return;
  }

  const q = e.target.closest(".q");
  if (q){
    const n = Number(q.dataset.n), i = Number(q.dataset.i);
    prog[n] = prog[n] || {};
    prog[n][i] = !prog[n][i];
    saveProg();
    q.setAttribute("aria-pressed", String(!!prog[n][i]));
    renderRail(); renderGauge();
    const badge = document.querySelector(".head .eyebrow");
    if (badge){
      const old = badge.querySelector(".pill.lv1:last-child");
      const has = old && old.textContent.indexOf("클리어") >= 0;
      if (stageDone(n) && !has){
        const el = document.createElement("span");
        el.className = "pill lv1"; el.textContent = "✓ 클리어"; badge.appendChild(el);
      } else if (!stageDone(n) && has) old.remove();
    }
    return;
  }

  const clip = e.target.closest(".slab.clip");
  if (clip && !e.target.closest(".copy")){
    clip.classList.remove("clip");
    return;
  }

  const tb = e.target.closest(".trybtn");
  if (tb){
    const box = tb.closest(".try");
    const slot = box.querySelector(".try-box");
    if (box.classList.contains("on")){
      box.classList.remove("on");
      slot.innerHTML = "";                       // 멈추고 비우기
      tb.textContent = "실행";
    } else {
      const src = box.parentNode.querySelector(".slab pre").textContent;
      const f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-scripts allow-modals allow-same-origin");
      f.setAttribute("title", "직접 해보기");
      f.srcdoc = src;
      slot.appendChild(f);
      box.classList.add("on");
      tb.textContent = "닫기";
    }
    return;
  }

  const jmp = e.target.closest(".jchip");
  if (jmp){
    const sc = document.querySelector('.body section[data-j="' + jmp.dataset.j + '"]');
    if (sc){
      const y = sc.getBoundingClientRect().top + window.scrollY - 92;
      window.scrollTo({ top: y, behavior: "smooth" });
    }
    return;
  }

  if (e.target.closest("#nameBtn")){
    const txt = namePrompt();
    if (txt){
      const btn = document.getElementById("nameBtn");
      const ok = function(){
        btn.textContent = "✓ 복사됨! ChatGPT·제미나이에 붙여넣으세요";
        setTimeout(function(){
          btn.textContent = "🤖 이름·이모지 지어 달라고 물어보기";
        }, 2600);
      };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, ok); else ok();
    }
    return;
  }

  const gchip = e.target.closest(".gchip");
  if (gchip){
    const row = gchip.closest(".gchips");
    const on = gchip.getAttribute("aria-pressed") === "true";
    if (row.dataset.multi !== "1"){
      row.querySelectorAll(".gchip").forEach(function(b){ b.setAttribute("aria-pressed", "false"); });
    }
    gchip.setAttribute("aria-pressed", String(!on));
    genBuild();
    return;
  }

  if (e.target.closest("#gCopy")){
    const txt = document.getElementById("gOut").textContent;
    const btn = document.getElementById("gCopy");
    const ok = function(){ btn.textContent = "복사됨!";
      setTimeout(function(){ btn.textContent = "복사"; }, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, ok); else ok();
    return;
  }

  const chip = e.target.closest(".chip");
  if (chip){
    const box = chip.closest(".sec");
    const target = box.querySelectorAll(".cf")[Number(chip.dataset.code)];
    if (target){
      target.open = true;
      box.querySelectorAll(".chip").forEach(function(x){ x.classList.remove("on"); });
      chip.classList.add("on");
      const y = target.getBoundingClientRect().top + window.scrollY - 92;
      window.scrollTo({ top: y, behavior: "smooth" });
    }
    return;
  }

  const uq = e.target.closest(".uq");
  if (uq){
    const n = Number(uq.dataset.n), key = "u" + uq.dataset.u;
    prog[n] = prog[n] || {};
    prog[n][key] = !prog[n][key];
    saveProg();
    uq.setAttribute("aria-pressed", String(!!prog[n][key]));
    const box = uq.closest(".upg");
    const got = box.querySelectorAll('.uq[aria-pressed="true"]').length;
    const goal = Number(box.querySelector(".ucnt").textContent.split("/")[1].trim().split(" ")[0]);
    box.querySelector(".ud").textContent = got;
    box.classList.toggle("clear", got >= goal);
    return;
  }

  const cq = e.target.closest(".cq");
  if (cq){
    const n = Number(cq.dataset.n), key = "c" + cq.dataset.c;
    prog[n] = prog[n] || {};
    prog[n][key] = !prog[n][key];
    saveProg();
    cq.setAttribute("aria-pressed", String(!!prog[n][key]));
    const box = cq.closest(".chal");
    const all = box.querySelectorAll(".cq");
    const got = box.querySelectorAll('.cq[aria-pressed="true"]').length;
    box.querySelector(".cd").textContent = got;
    box.classList.toggle("clear", got === all.length);
    return;
  }

  const cp = e.target.closest(".copy");
  if (cp){
    const txt = CODES[Number(cp.dataset.code)];
    navigator.clipboard.writeText(txt).then(() => {
      cp.textContent = "복사됨 ✓"; cp.classList.add("ok");
      setTimeout(() => { cp.textContent = "복사"; cp.classList.remove("ok"); }, 1600);
    }).catch(() => { cp.textContent = "Ctrl+C 로 복사"; });
    return;
  }

  if (e.target.id === "reset"){
    if (confirm("체크해 둔 미션을 모두 지울까요?")){ prog = {}; saveProg(); render(); }
    return;
  }
  if (e.target.id === "tab-home")  { tab = "home";  render(); return; }
  if (e.target.id === "tab-cheat") { tab = "cheat"; render(); window.scrollTo({top:0}); return; }
});

/* 주소의 #stage7 을 화면에 반영 */
function viewFromHash(){
  const m = location.hash.match(/stage(\d+)/);
  return m ? Number(m[1]) : "home";
}

/* 뒤로/앞으로 가기, 주소창에 직접 입력한 #stage7 도 동작하게 */
/* div 로 바뀐 미션을 Enter·Space 로도 체크할 수 있게 */
document.addEventListener("keydown", function(e){
  const q = e.target.classList && e.target.classList.contains("q") ? e.target : null;
  if (!q) return;
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); q.click(); }
});

document.addEventListener("input", function(e){
  if (e.target.classList && e.target.classList.contains("gtext")) genBuild();
  if (e.target.classList && e.target.classList.contains("ptext")) planSave();
});

window.addEventListener("hashchange", () => {
  const next = viewFromHash();
  if (tab === "home" && view === next) return;   // 이미 그 화면이면 그냥 둠
  tab = "home";
  view = next;
  render();
});

/* 첫 진입 */
(function init(){
  view = viewFromHash();
  render();
})();
</script>
