<title>방과후 미션보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">

<style>
/* ── 토큰 : 밝은 테마(기본) ───────────────────────────── */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#E8EDF1;
  --ink:#15181C; --ink-2:#495159; --ink-3:#79838D;
  --line:#DBE1E7; --line-2:#C6CFD8;
  --x:#D9433F; --y:#4E9410; --z:#2360CE;
  --y-soft:#EAF5DC; --x-soft:#FBE7E6; --z-soft:#E3ECFC;
  --shadow:0 1px 2px rgba(20,30,40,.06), 0 8px 24px -12px rgba(20,30,40,.18);
  --slab:#1D2226; --slab-2:#272D33; --slab-line:#343C43; --slab-ink:#DDE3E8;
  --slab-kw:#7FB3FF; --slab-ty:#9BDE4F; --slab-st:#FF8A84; --slab-cm:#6E7A85; --slab-fn:#E9C46A;
  --r:14px;
}
/* ── 토큰 : 어두운 테마 (유니티 에디터 그레이) ─────────── */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F2225; --surface:#2A2E32; --surface-2:#32373C; --surface-3:#3A4046;
    --ink:#ECEFF2; --ink-2:#AFB7BF; --ink-3:#828B95;
    --line:#3C4248; --line-2:#4A5158;
    --x:#FF6F6A; --y:#8CDA3F; --z:#6BA5F7;
    --y-soft:#2C3A22; --x-soft:#3B2725; --z-soft:#22303F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1F2225; --surface:#2A2E32; --surface-2:#32373C; --surface-3:#3A4046;
  --ink:#ECEFF2; --ink-2:#AFB7BF; --ink-3:#828B95;
  --line:#3C4248; --line-2:#4A5158;
  --x:#FF6F6A; --y:#8CDA3F; --z:#6BA5F7;
  --y-soft:#2C3A22; --x-soft:#3B2725; --z-soft:#22303F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.72; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{text-wrap:balance; margin:0}
a{color:var(--z)}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--z); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ── 헤더 ─────────────────────────────────────────────── */
.top{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:1px solid var(--line)}
.top-in{max-width:1240px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:11px; margin-right:auto}
.play{width:30px; height:30px; border-radius:8px; background:var(--y); display:grid; place-items:center; flex:none}
.play::after{content:""; width:0; height:0; margin-left:2px;
  border-left:9px solid #10160B; border-top:6px solid transparent; border-bottom:6px solid transparent}
.brand b{font-size:1.12rem; letter-spacing:-.01em; display:block}
.brand span{display:block; font-size:.71rem; color:var(--ink-3); letter-spacing:.09em; line-height:1.3}

.tabs{display:flex; gap:5px; background:var(--surface-2); padding:4px; border-radius:11px}
.tab{border:0; background:transparent; color:var(--ink-2); cursor:pointer;
  padding:7px 15px; border-radius:8px; font-size:.9rem; font-weight:600}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

.gauge{display:flex; align-items:center; gap:10px}
.gauge svg{display:block; transform:rotate(-90deg)}
.gauge-t{font-size:.74rem; color:var(--ink-3); line-height:1.35}
.gauge-t b{display:block; font-size:.95rem; color:var(--ink); font-variant-numeric:tabular-nums}

/* ── 레이아웃 ─────────────────────────────────────────── */
.wrap{max-width:1240px; margin:0 auto; padding:26px 22px 90px;
  display:grid; grid-template-columns:250px minmax(0,1fr); gap:30px; align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:1fr; gap:18px; padding:16px 14px 70px} }

/* ── 좌측 스테이지 트랙 ───────────────────────────────── */
.rail{position:sticky; top:78px}
.rail-h{font-size:.69rem; letter-spacing:.16em; color:var(--ink-3); font-weight:600; margin:0 0 10px 4px}
.track{display:flex; flex-direction:column; gap:3px; position:relative}
.track::before{content:""; position:absolute; left:20px; top:18px; bottom:18px; width:2px; background:var(--line); border-radius:2px}
.node{position:relative; display:grid; grid-template-columns:40px 1fr; gap:11px; align-items:center;
  border:0; background:transparent; text-align:left; cursor:pointer;
  padding:6px 9px; border-radius:11px; color:var(--ink-2); width:100%; transition:background .14s}
.node:hover{background:var(--surface-2)}
.node .dot{position:relative; z-index:1; width:40px; height:40px; border-radius:11px;
  background:var(--surface); border:2px solid var(--line-2); color:var(--ink-3);
  display:grid; place-items:center; font-size:1rem; flex:none;
  font-family:"Black Han Sans",sans-serif; font-variant-numeric:tabular-nums}
.node .lb{min-width:0}
.node .lb b{display:block; font-size:.87rem; font-weight:600; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.4}
.node .lb i{font-style:normal; font-size:.7rem; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}
.node.on{background:var(--surface); box-shadow:var(--shadow)}
.node.on .dot{background:var(--y); border-color:var(--y); color:#10160B}
.node.done .dot{background:var(--y-soft); border-color:var(--y); color:var(--y)}
.node.on.done .dot{background:var(--y); color:#10160B}

@media (max-width:900px){
  .rail{position:static}
  .rail-h{display:none}
  .track{flex-direction:row; overflow-x:auto; gap:7px; padding:4px 2px 10px}
  .track::before{display:none}
  .node{grid-template-columns:1fr; width:auto; flex:none; padding:5px; justify-items:center}
  .node .lb{display:none}
}

/* ── 본문 카드 ────────────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden}
.pane{animation:in .28s ease both}
@keyframes in{from{opacity:0; transform:translateY(6px)}to{opacity:1;transform:none}}

.head{padding:26px 30px 24px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface-2),var(--surface))}
@media (max-width:640px){ .head{padding:20px 18px} }
.eyebrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px}
.pill{font-size:.71rem; font-weight:600; letter-spacing:.03em; padding:3px 10px; border-radius:99px;
  border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface)}
.pill.date{font-family:"IBM Plex Mono",monospace; letter-spacing:0}
.pill.lv1{background:var(--y-soft); border-color:transparent; color:var(--y)}
.pill.lv2{background:var(--z-soft); border-color:transparent; color:var(--z)}
.pill.lv3{background:var(--x-soft); border-color:transparent; color:var(--x)}
.pill.stg{font-family:"Black Han Sans",sans-serif; letter-spacing:.1em;
  background:var(--ink); color:var(--bg); border-color:transparent}
.head h1{font-family:"Black Han Sans",sans-serif; font-size:clamp(1.55rem,4.4vw,2.3rem);
  line-height:1.3; letter-spacing:-.005em; font-weight:400}
.head p{margin:11px 0 0; color:var(--ink-2); font-size:1.01rem; max-width:62ch}

.body{padding:8px 30px 30px}
@media (max-width:640px){ .body{padding:6px 18px 22px} }
.sec{padding-top:26px}
.sec-h{display:flex; align-items:baseline; gap:10px; margin-bottom:13px; flex-wrap:wrap}
.sec-h h2{font-size:1rem; font-weight:700; letter-spacing:-.01em}
.sec-h em{font-style:normal; font-size:.77rem; color:var(--ink-3)}

/* 타임테이블 */
.clock{display:flex; border:1px solid var(--line); border-radius:11px; overflow:hidden}
.clock div{flex:1; padding:11px 14px; border-right:1px solid var(--line); background:var(--surface-2); min-width:0}
.clock div:last-child{border-right:0}
.clock b{display:block; font-family:"IBM Plex Mono",monospace; font-size:1rem; color:var(--ink)}
.clock span{font-size:.77rem; color:var(--ink-3)}
@media (max-width:560px){ .clock{flex-wrap:wrap} .clock div{flex:1 1 45%; border-bottom:1px solid var(--line)} }

/* 미션 체크리스트 */
.quests{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.quests li{display:flex}
.q{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
  padding:12px 15px; color:var(--ink); font-size:.96rem; line-height:1.62; transition:.14s}
.q:hover{border-color:var(--line-2)}
.q .bx{width:21px; height:21px; border-radius:6px; border:2px solid var(--line-2);
  flex:none; margin-top:3px; display:grid; place-items:center; font-size:.78rem; color:transparent;
  font-weight:700; transition:.14s}
.q[aria-pressed="true"]{background:var(--y-soft); border-color:var(--y)}
.q[aria-pressed="true"] .bx{background:var(--y); border-color:var(--y); color:#10160B; transform:scale(1.07)}
.q[aria-pressed="true"] .qt{color:var(--ink-2)}
.q .qn{font-family:"IBM Plex Mono",monospace; font-size:.77rem; color:var(--ink-3); flex:none; margin-top:3px}

/* 코드 슬랩 : 밝은/어두운 테마 모두에서 에디터 화면처럼 */
.slab{background:var(--slab); border-radius:12px; overflow:hidden; border:1px solid var(--slab-line)}
.slab + .slab{margin-top:12px}
.slab-top{display:flex; align-items:center; gap:9px; padding:8px 10px 8px 14px;
  background:var(--slab-2); border-bottom:1px solid var(--slab-line)}
.cs{width:17px; height:17px; border-radius:4px; background:#3E7A3B; color:#DFF5DC;
  font-size:.6rem; font-weight:700; display:grid; place-items:center; flex:none;
  font-family:"IBM Plex Mono",monospace}
.slab-top b{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--slab-ink); font-weight:400}
.copy{margin-left:auto; border:1px solid var(--slab-line); background:transparent; color:#A9B4BE;
  font-size:.76rem; padding:4px 11px; border-radius:7px; cursor:pointer; font-weight:500}
.copy:hover{background:#343C43; color:#fff}
.copy.ok{background:var(--slab-ty); border-color:var(--slab-ty); color:#10160B}
.slab pre{margin:0; padding:15px 17px; overflow-x:auto; font-family:"IBM Plex Mono",monospace;
  font-size:.84rem; line-height:1.78; color:var(--slab-ink); tab-size:4}
.slab .kw{color:var(--slab-kw)} .slab .ty{color:var(--slab-ty)}
.slab .st{color:var(--slab-st)} .slab .cm{color:var(--slab-cm)} .slab .fn{color:var(--slab-fn)}

/* 표 */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:11px}
table{border-collapse:collapse; width:100%; font-size:.89rem; min-width:380px}
th,td{padding:9px 14px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{background:var(--surface-2); font-weight:600; font-size:.77rem; letter-spacing:.05em; color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; color:var(--ink-2)}
code{font-family:"IBM Plex Mono",monospace; font-size:.86em;
  background:var(--surface-3); padding:1.5px 6px; border-radius:5px}
.slab code{background:transparent; padding:0}

/* 노트 박스 */
.note{border-radius:11px; padding:14px 17px; font-size:.92rem; line-height:1.68;
  border:1px solid var(--line); background:var(--surface-2)}
.note + .note{margin-top:9px}
.note.warn{background:var(--x-soft); border-color:transparent}
.note.tip{background:var(--z-soft); border-color:transparent}
.note > b{display:block; margin-bottom:5px}
.note ul,.note ol{margin:6px 0 0; padding-left:19px} .note li{margin:5px 0}
.note li b{display:inline}

/* 링크 목록 */
.links{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:9px}
.lk{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;
  border:1px solid var(--line); border-radius:11px; padding:12px 15px; background:var(--surface-2);
  width:100%; text-align:left; font:inherit; cursor:pointer}
.lk:hover{border-color:var(--z); background:var(--surface)}
.lk .lt{min-width:0}
.lk b{display:block; font-size:.93rem; line-height:1.45}
.lk i{font-style:normal; display:block; font-family:"IBM Plex Mono",monospace;
  font-size:.76rem; color:var(--z); word-break:break-all}
.lk em{font-style:normal; display:block; font-size:.78rem; color:var(--ink-3); line-height:1.55; margin-top:2px}
.lk .ar{margin-left:auto; color:var(--ink-3); font-size:1.05rem; flex:none}
.step p a, .lc p a{color:var(--z); text-decoration:underline; text-underline-offset:2px}

/* 개념 카드 */
.learn{display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:10px}
.lc{border:1px solid var(--line); border-radius:11px; padding:14px 16px; background:var(--surface-2)}
.lc .k{display:block; font-family:"IBM Plex Mono",monospace; font-size:.68rem;
  color:var(--y); letter-spacing:.1em; margin-bottom:4px}
.lc > b{display:block; font-size:.93rem; margin-bottom:5px; line-height:1.5}
.lc p{margin:0; font-size:.875rem; color:var(--ink-2); line-height:1.72}
.lc p b{display:inline; color:var(--ink)}
.lc code{background:var(--surface-3)}

/* 설치 단계 */
.card2{border:1px solid var(--line); border-radius:12px; padding:4px 18px; background:var(--surface-2)}
.steps{display:flex; flex-direction:column}
.step{display:grid; grid-template-columns:34px 1fr; gap:14px; padding:15px 0;
  border-bottom:1px solid var(--line); align-items:start}
.step:last-child{border-bottom:0}
.step .sn{width:34px; height:34px; border-radius:10px; background:var(--z-soft); color:var(--z);
  display:grid; place-items:center; font-family:"Black Han Sans",sans-serif; font-size:1rem}
.step > span > b{display:block; font-size:.98rem; margin-bottom:4px; line-height:1.5}
.step p{margin:0; font-size:.9rem; color:var(--ink-2); line-height:1.78}
.step p b{display:inline; color:var(--ink)}
.step code{background:var(--surface-3)}
@media (max-width:520px){ .card2{padding:4px 14px} .step{grid-template-columns:28px 1fr; gap:11px}
  .step .sn{width:28px;height:28px;font-size:.85rem} }

/* 보너스 */
.bonus{border:2px dashed var(--line-2); border-radius:12px; padding:15px 18px}
.bonus > b{color:var(--y); display:block; margin-bottom:2px}
.bonus ul{margin:7px 0 0; padding-left:19px} .bonus li{margin:4px 0; font-size:.93rem}

/* 하단 이동 */
.nav{display:flex; gap:10px; margin-top:30px}
.nav button{flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:11px; padding:13px 16px; cursor:pointer; text-align:left; font-size:.89rem}
.nav button:hover:not(:disabled){border-color:var(--y)}
.nav button:disabled{opacity:.32; cursor:default}
.nav button span{display:block; font-size:.71rem; color:var(--ink-3)}
.nav .r{text-align:right}

/* 홈 */
.hero{padding:34px 30px}
@media (max-width:640px){ .hero{padding:24px 18px} }
.hero h1{font-family:"Black Han Sans",sans-serif; font-weight:400;
  font-size:clamp(1.85rem,6vw,2.9rem); line-height:1.24}
.hero .lead{margin:14px 0 0; font-size:1.04rem; color:var(--ink-2); max-width:58ch}
.axis{display:flex; gap:7px; margin-bottom:18px}
.axis i{width:28px; height:5px; border-radius:3px; display:block}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:11px}
.mini{border:1px solid var(--line); border-radius:11px; padding:14px 16px; background:var(--surface-2)}
.mini > b{display:block; font-size:.91rem; margin-bottom:3px}
.mini p{margin:0; font-size:.85rem; color:var(--ink-2); line-height:1.6}
.mini p b{display:inline; color:var(--ink)}
.chapters{display:flex; flex-direction:column; gap:8px}
.chap{display:grid; grid-template-columns:44px 1fr auto; gap:14px; align-items:center;
  border:1px solid var(--line); border-radius:11px; padding:11px 15px; background:var(--surface-2);
  cursor:pointer; text-align:left; color:inherit; width:100%; font-size:.94rem}
.chap:hover{border-color:var(--y); background:var(--surface)}
.chap .num{font-family:"Black Han Sans",sans-serif; font-size:1.25rem; color:var(--ink-3); text-align:center}
.chap.done .num{color:var(--y)}
.chap .tt b{display:block; font-weight:600; line-height:1.45}
.chap .tt span{font-size:.79rem; color:var(--ink-3)}
.chap .dt{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--ink-3)}
@media (max-width:560px){ .chap{grid-template-columns:36px 1fr} .chap .dt{display:none} }

.reset{border:1px solid var(--line); background:transparent; color:var(--ink-3);
  border-radius:9px; padding:7px 13px; font-size:.79rem; cursor:pointer}
.reset:hover{border-color:var(--x); color:var(--x)}
.foot{max-width:1240px; margin:0 auto; padding:4px 22px 46px; text-align:center}
.foot p{margin:8px 0 0; color:var(--ink-3); font-size:.79rem}
.sig{display:inline-flex; align-items:center; gap:9px; padding:8px 17px 8px 12px;
  border:1px solid var(--line); border-radius:99px; background:var(--surface)}
.sig .bun{font-size:1.1rem; line-height:1; transform:translateY(-1px)}
.sig b{font-family:"IBM Plex Mono",monospace; font-size:.86rem; font-weight:600;
  letter-spacing:.02em; color:var(--ink-2)}
.sig:hover .bun{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-7px)}60%{transform:translateY(-1px)}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="play" aria-hidden="true"></div>
      <div>
        <b>방과후 미션보드</b>
        <span>웹으로 만드는 게임 &amp; 우리 팀 앱</span>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="화면 전환">
      <button class="tab" role="tab" id="tab-home" aria-selected="true">미션</button>
      <button class="tab" role="tab" id="tab-cheat" aria-selected="false">치트키</button>
    </div>
    <div class="gauge" title="내 진행률">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
        <circle cx="19" cy="19" r="15.5" fill="none" stroke="var(--line)" stroke-width="4"></circle>
        <circle id="ring" cx="19" cy="19" r="15.5" fill="none" stroke="var(--y)" stroke-width="4"
                stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4"></circle>
      </svg>
      <div class="gauge-t"><b id="pct">0%</b>클리어</div>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="rail" aria-label="차시 목록">
    <p class="rail-h">STAGE SELECT</p>
    <div class="track" id="track"></div>
  </nav>
  <main id="main"></main>
</div>

<footer class="foot">
  <div class="sig"><span class="bun">🐰</span><b>pcteachpc</b></div>
  <p>2026학년도 2학기 방과후학교 · 웹으로 만드는 게임 &amp; 우리 팀 앱</p>
</footer>

<script>
/* ══════════════════════════════════════════════════════════
   데이터
   ══════════════════════════════════════════════════════════ */
const STAGES = [
{
 n:1, date:"7차시 · 10/19", lv:1, lvName:"첫 JS",
 title:"버튼이 살아난다",
 sub:"지금까지 만든 화면에 처음으로 '움직임'을 넣습니다. 오늘 클릭 게임 하나를 완성해요.",
 learn:[

 code:[["click.html", `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>클릭 연타 게임</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #eef2f7; padding: 40px; }
  h1 { font-size: 34px; }
  #score { font-size: 90px; font-weight: bold; color: #2563eb; margin: 10px; }
  #msg { font-size: 28px; color: #16a34a; height: 40px; }
  button { font-size: 26px; padding: 18px 46px; border: 0; border-radius: 16px;
           background: #2563eb; color: white; cursor: pointer; }
  button:active { transform: scale(0.94); }
  #reset { background: #94a3b8; font-size: 16px; padding: 10px 24px; margin-top: 20px; }
</style>
</head>
<body>

  <h1>🖱️ 클릭 연타 게임</h1>
  <p>목표 : <b>20번</b> 누르기!</p>

  <div id="score">0</div>
  <div id="msg"></div>

  <button id="btn">눌러!</button>
  <br>
  <button id="reset">다시하기</button>

<script>
  // 1. 점수를 담을 상자(변수)
  let score = 0;

  // 2. 화면에 있는 것들을 잡아 온다
  const btn       = document.getElementById("btn");
  const scoreText = document.getElementById("score");
  const msg       = document.getElementById("msg");
  const resetBtn  = document.getElementById("reset");

  // 3. 버튼을 누르면 이 안이 실행된다
  btn.onclick = function () {
    score = score + 1;           // 점수 1 올리기
    scoreText.innerText = score; // 화면에 보여주기

    if (score >= 20) {           // 20점이 넘으면
      msg.innerText = "🎉 클리어!";
    }
  };

  // 4. 다시하기
  resetBtn.onclick = function () {
    score = 0;
    scoreText.innerText = 0;
    msg.innerText = "";
  };
<\/script>

</body>
</html>`]],

 code:[["mole.html", `<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>두더지 잡기</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #eef2f7; padding: 30px; }
  h1 { font-size: 30px; margin: 0 0 6px; }
  #info { font-size: 22px; margin-bottom: 16px; }
  #score, #time { font-weight: bold; color: #2563eb; }
  .grid { display: grid; grid-template-columns: repeat(3, 110px);
          gap: 12px; justify-content: center; }
  .hole { width: 110px; height: 110px; background: #cbd5e1; border-radius: 20px;
          font-size: 60px; line-height: 110px; cursor: pointer; user-select: none; }
  .hole:active { background: #94a3b8; }
  button { font-size: 20px; padding: 14px 36px; border: 0; border-radius: 14px;
           background: #2563eb; color: white; cursor: pointer; margin-top: 20px; }
</style>
</head>
<body>

  <h1>🐹 두더지 잡기</h1>
  <div id="info">점수 <span id="score">0</span> · 남은 시간 <span id="time">20</span>초</div>

  <div class="grid">
    <div class="hole" id="h0"></div>
    <div class="hole" id="h1"></div>
    <div class="hole" id="h2"></div>
    <div class="hole" id="h3"></div>
    <div class="hole" id="h4"></div>
    <div class="hole" id="h5"></div>
    <div class="hole" id="h6"></div>
    <div class="hole" id="h7"></div>
    <div class="hole" id="h8"></div>
  </div>

  <button id="start">시작!</button>

<script>
  let score = 0;
  let time  = 20;
  let now   = -1;      // 지금 두더지가 있는 구멍 번호
  let moleTimer, clockTimer;

  const scoreText = document.getElementById("score");
  const timeText  = document.getElementById("time");

  // 두더지를 아무 구멍에나 띄우기
  function showMole() {
    if (now >= 0) {
      document.getElementById("h" + now).innerText = "";
    }
    now = Math.floor(Math.random() * 9);   // 0~8 중 하나
    document.getElementById("h" + now).innerText = "🐹";
  }

  // 1초마다 시간 줄이기
  function countDown() {
    time = time - 1;
    timeText.innerText = time;
    if (time <= 0) {
      clearInterval(moleTimer);
      clearInterval(clockTimer);
      if (now >= 0) document.getElementById("h" + now).innerText = "";
      alert("끝! 점수는 " + score + "점");
    }
  }

  // 구멍 9개에 전부 클릭 기능 달기
  for (let i = 0; i < 9; i = i + 1) {
    document.getElementById("h" + i).onclick = function () {
      if (i === now) {             // 두더지가 있는 구멍을 눌렀으면
        score = score + 1;
        scoreText.innerText = score;
        document.getElementById("h" + i).innerText = "";
        now = -1;
      }
    };
  }

  // 시작 버튼
  document.getElementById("start").onclick = function () {
    score = 0; time = 20;
    scoreText.innerText = 0;
    timeText.innerText = 20;
    clearInterval(moleTimer);
    clearInterval(clockTimer);
    moleTimer  = setInterval(showMole, 800);   // 0.8초마다 두더지 이동
    clockTimer = setInterval(countDown, 1000); // 1초마다 시간 감소
  };
<\/script>

</body>
</html>`]],

  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; }
}
function saveProg(){
  try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch(e){}
}
function isDone(n, i){ return !!(prog[n] && prog[n][i]); }
function stageDone(n){
  const s = STAGES.find(x => x.n === n);
  return s.quests.every((_, i) => isDone(n, i));
}
function doneCount(){
  let c = 0;
  STAGES.forEach(s => s.quests.forEach((_, i) => { if (isDone(s.n, i)) c++; }));
  return c;
}

/* ══════════════════════════════════════════════════════════
   유틸
   ══════════════════════════════════════════════════════════ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* HTML · CSS · JS 한 파일을 함께 칠하는 간단 하이라이터 */
function hl(src){
  const re = new RegExp([
    "(<!--[\\s\\S]*?-->)",              // 1 HTML 주석
    "(/\\*[\\s\\S]*?\\*/)",             // 2 CSS 주석
    "(//[^\\n]*)",                      // 3 JS 주석
    '("(?:[^"\\\\]|\\\\.)*")',          // 4 문자열
    "(</?[a-zA-Z][\\w-]*)",             // 5 HTML 태그
    "\\b(let|const|var|function|if|else|return|for|while|true|false|null|new|typeof)\\b", // 6 키워드
    "\\b(document|window|Math|console|alert|setInterval|setTimeout|clearInterval|" +
      "parseInt|getElementById|querySelector|querySelectorAll|addEventListener|" +
      "createElement|appendChild|innerText|innerHTML|style|push|splice|remove|" +
      "length|floor|random|abs|onclick|disabled|className|Audio)\\b"                      // 7 내장 기능
  ].join("|"), "g");

  let out = "", last = 0, m;
  while ((m = re.exec(src)) !== null){
    out += esc(src.slice(last, m.index));
    if (m[1] || m[2] || m[3]) out += '<span class="cm">' + esc(m[1] || m[2] || m[3]) + "</span>";
    else if (m[4]) out += '<span class="st">' + esc(m[4]) + "</span>";
    else if (m[5]) out += '<span class="ty">' + esc(m[5]) + "</span>";
    else if (m[6]) out += '<span class="kw">' + m[6] + "</span>";
    else           out += '<span class="fn">' + m[7] + "</span>";
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

const CODES = [];   // 복사 버튼용 원본 코드 보관

function slabHTML(name, code){
  const id = CODES.push(code) - 1;
  return '<div class="slab"><div class="slab-top"><span class="cs">C#</span><b>' + esc(name) +
         '</b><button class="copy" data-code="' + id + '">복사</button></div><pre><code>' +
         hl(code) + "</code></pre></div>";
}
function tableHTML(t){
  const cells = t.rows.map(r => "<tr>" + r.map((c, i) =>
    '<td class="' + (t.num && i > 0 ? "n" : "") + '">' + c + "</td>").join("") + "</tr>").join("");
  return (t.cap ? '<div class="sec-h"><h2>' + t.cap + "</h2></div>" : "") +
         '<div class="tw"><table><thead><tr>' + t.head.map(h => "<th>" + h + "</th>").join("") +
         "</tr></thead><tbody>" + cells + "</tbody></table></div>";
}
function noteHTML(n){
  return '<div class="note ' + n[0] + '"><b>' + (n[0] === "warn" ? "⚠️ " : "💡 ") + n[1] + "</b>" + n[2] + "</div>";
}
function sec(title, hint, inner){
  return '<section class="sec"><div class="sec-h"><h2>' + title + "</h2>" +
         (hint ? "<em>" + hint + "</em>" : "") + "</div>" + inner + "</section>";
}

/* ══════════════════════════════════════════════════════════
   화면 그리기
   ══════════════════════════════════════════════════════════ */
const trackEl = document.getElementById("track");
const mainEl  = document.getElementById("main");

function renderRail(){
  let h = '<button class="node' + (tab === "home" && view === "home" ? " on" : "") +
          '" data-go="home"><span class="dot">◎</span><span class="lb"><b>코스 안내</b><i>남은 8개 미션</i></span></button>';
  h += STAGES.map(s => {
    const on = tab === "home" && view === s.n;
    const dn = stageDone(s.n);
    return '<button class="node' + (on ? " on" : "") + (dn ? " done" : "") + '" data-go="' + s.n + '">' +
           '<span class="dot">' + (dn ? "✓" : String(s.n).padStart(2, "0")) + "</span>" +
           '<span class="lb"><b>' + s.title + "</b><i>" + s.date + "</i></span></button>";
  }).join("");
  trackEl.innerHTML = h;
}

function renderGauge(){
  const d = doneCount();
  const p = TOTAL ? Math.round(d / TOTAL * 100) : 0;
  document.getElementById("ring").setAttribute("stroke-dashoffset", CIRC * (1 - p / 100));
  document.getElementById("pct").textContent = p + "%";
}

    '<button class="chap' + (stageDone(s.n) ? " done" : "") + '" data-go="' + s.n + '">' +

    '<span class="tt"><b>' + s.title + "</b><span>" + s.sub + "</span></span>" +

  return '<div class="card pane"><div class="hero">' +

    "이제 마지막 하나, <b>움직이게 만드는 법</b>을 배웁니다. " +

    '<div class="grid3" style="margin-top:22px">' +

      '<div class="mini"><b>🏆 2차 완성작 · 마지막 미션</b><p>팀으로 만드는 <b>우리 학교 문제 해결 앱</b>. 발표회로 마무리합니다.</p></div>' +
      '<div class="mini"><b>🧰 준비물</b><p>메모장과 브라우저면 끝. <b>인터넷이 끊겨도</b> 돌아갑니다.</p></div>' +
    "</div></div>" +
    '<div class="body">' +
      sec("전체 코스", "카드를 누르면 그 차시로 이동합니다", '<div class="chapters">' + chaps + "</div>") +
      sec("🏆 작품 전시관", "팀 프로젝트 완성작이 여기 올라갑니다",
        '<div class="links"><a class="lk" href="teams/" target="_blank" rel="noopener">' +

        '<em>친구들이 만든 앱을 눌러서 바로 플레이해 보세요</em></span>' +
        '<span class="ar">↗</span></a></div>') +
      sec("수업 약속", "",
        '<div class="note tip"><b>💡 이 수업의 규칙 4가지</b><ul>' +
        "<li><b>천천히 갑니다.</b> 못 따라와도 괜찮아요. 옆 친구랑 같이 하세요.</li>" +
        "<li><b>코드는 외우지 않습니다.</b> 필요할 때 이 페이지에서 복사하세요.</li>" +
        "<li><b>숫자를 마음대로 바꿔 보세요.</b> 망가뜨리는 게 가장 빠른 학습입니다. (Ctrl+Z 가 있어요)</li>" +
        "<li><b>저장(Ctrl+S) 하고 새로고침(F5).</b> 이걸 안 하면 아무것도 안 바뀝니다.</li>" +
        "<li><b>5분 넘게 막히면 손을 드세요.</b> 🙋</li></ul></div>") +

function stageHTML(s){
  const idx = STAGES.indexOf(s);
  const prev = STAGES[idx - 1], next = STAGES[idx + 1];

  let h = '<div class="card pane"><div class="head">' +
    '<div class="eyebrow">' +
      '<span class="pill stg">STAGE ' + String(s.n).padStart(2, "0") + "</span>" +
      '<span class="pill date">' + s.date + (s.date.indexOf("/") >= 0 ? " (월) 16:50–17:50" : "") + "</span>" +
      '<span class="pill lv' + s.lv + '">' + s.lvName + "</span>" +
      (stageDone(s.n) ? '<span class="pill lv1">✓ 클리어</span>' : "") +
    "</div><h1>" + s.title + "</h1><p>" + s.sub + "</p></div><div class=\"body\">";

  if (s.install && s.install.length)
    h += sec("⬇️ 유니티 설치, 8단계", "순서대로 따라오세요",
          '<div class="card2"><div class="steps">' + s.install.map((st, i) =>
            '<div class="step"><span class="sn">' + (i + 1) + "</span>" +
            "<span><b>" + st[0] + "</b><p>" + st[1] + "</p></span></div>").join("") + "</div></div>");

  if (s.learn && s.learn.length)
    h += sec("📖 오늘 알아야 할 것", "읽고 넘어가면 미션이 쉬워집니다",
          '<div class="learn">' + s.learn.map((l, i) =>
            '<div class="lc"><span class="k">' + String(i + 1).padStart(2, "0") + "</span><b>" +
            l[0] + "</b><p>" + l[1] + "</p></div>").join("") + "</div>");

  h += sec("🎯 오늘의 미션", "하나씩 누르며 체크하세요",
        '<ul class="quests">' + s.quests.map((q, i) =>
          '<li><button class="q" data-n="' + s.n + '" data-i="' + i + '" aria-pressed="' + isDone(s.n, i) + '">' +
          '<span class="bx">✓</span><span class="qn">' + String(i + 1).padStart(2, "0") + "</span>" +
          '<span class="qt">' + q + "</span></button></li>").join("") + "</ul>");

  if (s.code && s.code.length)
    h += sec("💻 오늘의 코드", "복사해서 붙여넣고 Ctrl+S", s.code.map(c => slabHTML(c[0], c[1])).join(""));

  if (s.tables) s.tables.forEach(t => { h += '<section class="sec">' + tableHTML(t) + "</section>"; });

  if (s.links && s.links.length)
    h += sec(s.linksTitle || "🔗 링크", "새 탭으로 열립니다",
          '<div class="links">' + s.links.map(l =>
            '<a class="lk" href="' + l[2] + '" target="_blank" rel="noopener">' +
            '<span class="lt"><b>' + l[0] + "</b><i>" + l[1] + "</i><em>" + l[3] + "</em></span>" +
            '<span class="ar">↗</span></a>').join("") + "</div>");

  if (s.notes && s.notes.length)
    h += sec("🆘 막히면 여기", "", s.notes.map(noteHTML).join(""));

  if (s.bonus && s.bonus.length)
    h += sec("🏆 보너스 미션", "다 끝냈다면 도전!",
          '<div class="bonus"><b>여유가 있다면</b><ul>' + s.bonus.map(b => "<li>" + b + "</li>").join("") + "</ul></div>");

  h += '<div class="nav">' +
    (prev ? '<button data-go="' + prev.n + '"><span>← 이전 차시</span>' + prev.title + "</button>"
          : '<button data-go="home"><span>←</span>코스 안내</button>') +
    (next ? '<button class="r" data-go="' + next.n + '"><span>다음 차시 →</span>' + next.title + "</button>"
          : '<button class="r" disabled><span>끝!</span>수고했어요 :D</button>') +
    "</div></div></div>";
  return h;
}

function cheatHTML(){
  let h = '<div class="card pane"><div class="head">' +
    '<div class="eyebrow"><span class="pill stg">CHEAT SHEET</span></div>' +
    "<h1>" + CHEAT.title + "</h1><p>" + CHEAT.sub + "</p></div><div class=\"body\">";
  h += sec("🔗 코드 가져오기", "누르면 그 차시로 이동합니다",
        '<div class="links">' + CHEAT.links.map(l => {
          const stage = (l[2].match(/stage(\d+)/) || [])[1];
          const open = stage ? '<button class="lk" data-go="' + stage + '">'
                             : '<a class="lk" href="' + l[2] + '" target="_blank" rel="noopener">';
          const close = stage ? "</button>" : "</a>";
          return open + '<span class="lt"><b>' + l[0] + "</b><i>" + l[1] + "</i><em>" + l[3] +
                 "</em></span><span class=\"ar\">" + (stage ? "›" : "↗") + "</span>" + close;
        }).join("") + "</div>");
  CHEAT.notes.forEach(n => { h += '<section class="sec">' + noteHTML(n) + "</section>"; });
  CHEAT.tables.forEach(t => { h += '<section class="sec">' + tableHTML(t) + "</section>"; });
  h += "</div></div>";
  return h;
}

function render(){
  CODES.length = 0;
  document.querySelector(".rail").style.display = tab === "cheat" ? "none" : "";
  document.querySelector(".wrap").style.gridTemplateColumns =
    tab === "cheat" ? "minmax(0,1fr)" : "";
  mainEl.style.maxWidth = tab === "cheat" ? "880px" : "";
  mainEl.style.margin   = tab === "cheat" ? "0 auto" : "";
  if (tab === "cheat")      mainEl.innerHTML = cheatHTML();
  else if (view === "home") mainEl.innerHTML = homeHTML();
  else                      mainEl.innerHTML = stageHTML(STAGES.find(s => s.n === view));
  renderRail();
  renderGauge();
  document.getElementById("tab-home").setAttribute("aria-selected", tab === "home");
  document.getElementById("tab-cheat").setAttribute("aria-selected", tab === "cheat");
}

/* ══════════════════════════════════════════════════════════
   이벤트
   ══════════════════════════════════════════════════════════ */
function go(target){
  tab  = "home";
  view = target === "home" ? "home" : Number(target);
  location.hash = target === "home" ? "" : "stage" + target;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.addEventListener("click", e => {
  const goBtn = e.target.closest("[data-go]");
  if (goBtn) { go(goBtn.dataset.go); return; }

  const q = e.target.closest(".q");
  if (q){
    const n = Number(q.dataset.n), i = Number(q.dataset.i);
    prog[n] = prog[n] || {};
    prog[n][i] = !prog[n][i];
    saveProg();
    q.setAttribute("aria-pressed", String(!!prog[n][i]));
    renderRail(); renderGauge();
    const badge = document.querySelector(".head .eyebrow");
    if (badge){
      const old = badge.querySelector(".pill.lv1:last-child");
      const has = old && old.textContent.indexOf("클리어") >= 0;
      if (stageDone(n) && !has){
        const el = document.createElement("span");
        el.className = "pill lv1"; el.textContent = "✓ 클리어"; badge.appendChild(el);
      } else if (!stageDone(n) && has) old.remove();
    }
    return;
  }

  const cp = e.target.closest(".copy");
  if (cp){
    const txt = CODES[Number(cp.dataset.code)];
    navigator.clipboard.writeText(txt).then(() => {
      cp.textContent = "복사됨 ✓"; cp.classList.add("ok");
      setTimeout(() => { cp.textContent = "복사"; cp.classList.remove("ok"); }, 1600);
    }).catch(() => { cp.textContent = "Ctrl+C 로 복사"; });
    return;
  }

  if (e.target.id === "reset"){
    if (confirm("체크해 둔 미션을 모두 지울까요?")){ prog = {}; saveProg(); render(); }
    return;
  }
  if (e.target.id === "tab-home")  { tab = "home";  render(); return; }
  if (e.target.id === "tab-cheat") { tab = "cheat"; render(); window.scrollTo({top:0}); return; }
});

/* 주소의 #stage7 을 화면에 반영 */
function viewFromHash(){
  const m = location.hash.match(/stage(\d+)/);
  return m ? Number(m[1]) : "home";
}

/* 뒤로/앞으로 가기, 주소창에 직접 입력한 #stage7 도 동작하게 */
window.addEventListener("hashchange", () => {
  const next = viewFromHash();
  if (tab === "home" && view === next) return;   // 이미 그 화면이면 그냥 둠
  tab = "home";
  view = next;
  render();
});

/* 첫 진입 */
(function init(){
  view = viewFromHash();
  render();
})();
</script>
