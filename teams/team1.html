<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>우리 팀 앱</title>
<style>
  /* ↓↓↓ 색과 글꼴은 마음대로 바꾸세요 ↓↓↓ */
  body { font-family: sans-serif; text-align: center; background: #eef2f7;
         padding: 30px; color: #15181c; }
  h1 { font-size: 32px; margin-bottom: 4px; }
  #desc { color: #64748b; margin-bottom: 24px; }
  #box { background: white; width: 420px; margin: 0 auto; padding: 30px;
         border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  #result { font-size: 44px; font-weight: bold; color: #2563eb;
            min-height: 60px; margin: 18px 0; }
  button { font-size: 20px; padding: 14px 34px; border: 0; border-radius: 14px;
           background: #2563eb; color: white; cursor: pointer; }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>

  <!-- ① 제목을 우리 앱 이름으로 바꾸세요 -->
  <h1>🍚 오늘 뭐 먹지?</h1>
  <p id="desc">버튼을 누르면 메뉴를 뽑아 드립니다</p>

  <div id="box">
    <div id="result">?</div>
    <button id="btn">뽑기!</button>
  </div>

<script>
  // ② 목록을 우리 주제에 맞게 바꾸세요
  const list = ["떡볶이", "김밥", "라면", "돈까스", "제육덮밥", "짜장면"];

  const result = document.getElementById("result");
  const btn    = document.getElementById("btn");

  // ③ 버튼을 누르면 목록에서 아무거나 하나 뽑기
  btn.onclick = function () {
    const i = Math.floor(Math.random() * list.length);
    result.innerText = list[i];
  };
</script>

</body>
</html>
